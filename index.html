        const FLOUR_DB = {

        const ROTATING_FLOURS = {
            winter: ["bajra", "makka", "wheat"],
            summer: ["jowar", "barley", "wheat"],
            monsoon: ["wheat", "besan"],
            tropical: ["ragi", "wheat", "rice"]
        };

        // --- COMPONENTS ---
        const MealItem = ({ icon, label, item, yt, sub, onEdit }) => (

                    <a href={yt} target="_blank" rel="noopener noreferrer" className="w-10 h-10 rounded-xl bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center no-print opacity-0 group-hover:opacity-100"><Icon name="Youtube" size={18} /></a>

        const SideItem = ({ side, flour }) => (
            side ? (
                <div className="flex items-center gap-4 ml-16 bg-slate-50 border border-slate-100 rounded-3xl p-5 shadow-sm relative overflow-hidden group">

        const App = () => {
            const [userApiKey, setUserApiKey] = useState(localStorage.getItem('t360_api_key') || '');
            
            const [view, setView] = useState('plan');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isExpanding, setIsExpanding] = useState(false);
            const [city, setCity] = useState("Mumbai");
            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [cycle, setCycle] = useState(7);
            const [isSyncing, setIsSyncing] = useState(true);
            const [showApiInput, setShowApiInput] = useState(false);
            const [errorBanner, setErrorBanner] = useState(null);
            
            const [repo, setRepo] = useState(MASTER_LIBRARY);
            const [customDish, setCustomDish] = useState({ name: '', hi: '', category: 'dry_veggies' });
            
            const [directives, setDirectives] = useState([
                "Lunch: MUST include Dual Dal pair",
                "Friday: No separate Dinner (Heavy snacks only)",
                "Saturday: Special Lunch",
                "Lunch: Rice 3 weekdays, Roti 2 weekdays (Wheat)",
                "Dinner: Alternate flours for Roti (Seasonal)",
                "Dinner: Must have Gravy dish"
            ]);
            const [tempDirectives, setTempDirectives] = useState([]);
            const [rulesSaved, setRulesSaved] = useState(true);
            
            const [history, setHistory] = useState([]);
            const [activeMenu, setActiveMenu] = useState(null);
            const [dislikedItems, setDislikedItems] = useState(new Set());
            const [editingMeal, setEditingMeal] = useState(null);

            useEffect(() => {
                const syncData = setTimeout(() => {
                    const savedRepo = localStorage.getItem('t360_repo_v12_5');
                    if (savedRepo) setRepo(JSON.parse(savedRepo));
                    const savedHistory = localStorage.getItem('t360_history_v12_5');
                    if (savedHistory) setHistory(JSON.parse(savedHistory));
                    const savedDislikes = localStorage.getItem('t360_dislikes_v12_5');
                    if (savedDislikes) setDislikedItems(new Set(JSON.parse(savedDislikes)));
                    const savedDirs = localStorage.getItem('t360_dirs_v12_5');
                    if (savedDirs) {
                        const parsed = JSON.parse(savedDirs);
                        setDirectives(parsed);
                        setTempDirectives(parsed);
                    } else {
                        setTempDirectives(directives);
                    }
                    setIsSyncing(false);
                }, 800);
                return () => clearTimeout(syncData);
            }, []);

            useEffect(() => {
                if (!isSyncing) {
                    localStorage.setItem('t360_repo_v12_5', JSON.stringify(repo));
                    localStorage.setItem('t360_history_v12_5', JSON.stringify(history));
                    localStorage.setItem('t360_dislikes_v12_5', JSON.stringify([...dislikedItems]));
                    localStorage.setItem('t360_dirs_v12_5', JSON.stringify(directives));
                    localStorage.setItem('t360_api_key', userApiKey);
                }
            }, [repo, history, dislikedItems, directives, isSyncing, userApiKey]);

            const callGemini = async (prompt, useSearch = false, retryCount = 0) => {
                const effectiveKey = userApiKey || apiKey;
                
                if (!effectiveKey) {
                    setShowApiInput(true);
                    throw new Error("Missing API Key. Please provide one in 'API Settings' above.");
                }
                
                try {
                    const payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    };
                    if (useSearch) payload.tools = [{ "google_search": {} }];

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${effectiveKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.status === 401 || response.status === 403) {
                         setShowApiInput(true);
                         throw new Error("Invalid or expired API Key. Update it in 'API Settings'.");
                    }

                    if (response.status === 429) {
                        throw new Error("Too Many Requests: Please wait a minute before retrying.");
                    }

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `API Error: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("Empty response from AI. Please try again.");
                    
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        // Attempt to clean text if AI included markdown wrappers
                        const cleaned = text.replace(/```json|```/g, "").trim();
                        return JSON.parse(cleaned);
                    }
                } catch (error) {
                    console.error("Gemini API Error:", error);
                    const isAuthError = error.message.includes("Unauthorized") || error.message.includes("API Key");
                    
                    if (retryCount < 2 && !isAuthError) {
                        await new Promise(res => setTimeout(res, Math.pow(2, retryCount) * 1000));
                        return callGemini(prompt, useSearch, retryCount + 1);
                    }
                    throw error;
                }
            };

            const discoverSeasonalDishes = async () => {
                setIsExpanding(true);
                setErrorBanner(null);
                const currentMonth = new Date(startDate).toLocaleString('default', { month: 'long' });
                try {
                    const prompt = `Perform a Deep Google Search for seasonal Indian vegetables and authentic Micro-Regional vegetarian dishes available in ${city} during ${currentMonth}. 
                    I want hidden gems, rare preparations, and hyper-local ingredients.
                    Return an exhaustive JSON object with keys: "breakfast", "dry_veggies", "gravy_veggies", "special_meals".
                    Find at least 10 items for each category.
                    Each value should be an array of: { "name": "English Name", "hi": "Hindi Name", "reason": "Why it's in season" }.`;
                    
                    const newDishes = await callGemini(prompt, true);
                    const updatedRepo = { ...repo };
                    
                    Object.keys(newDishes).forEach(cat => {
                        if (updatedRepo[cat]) {
                            const existingNames = new Set(updatedRepo[cat].map(d => d.name.toLowerCase()));
                            newDishes[cat].forEach(dish => {
                                if (dish && dish.name && !existingNames.has(dish.name.toLowerCase())) {
                                    updatedRepo[cat].push({ ...dish, season: 'seasonal' });
                                }
                            });
                        }
                    });
                    setRepo(updatedRepo);
                } catch (err) {
                    setErrorBanner(err.message);
                } finally {
                    setIsExpanding(false);
                }
            };

            const addManualDish = () => {
                if (!customDish.name || !customDish.hi) return;
                const updatedRepo = { ...repo };
                updatedRepo[customDish.category].push({ name: customDish.name, hi: customDish.hi, season: 'manual' });
                setRepo(updatedRepo);
                setCustomDish({ name: '', hi: '', category: 'dry_veggies' });
            };

            const getFlourDetails = (flourKey) => {
                if (!flourKey) return null;
                const key = flourKey.toLowerCase().split(' ')[0];
                return FLOUR_DB[key] || { en: flourKey, hi: flourKey };
            };

            const generateMenu = async () => {
                if (!rulesSaved) {
                    setErrorBanner("Please click 'Save Logic' before generating.");
                    return;
                }
                setIsGenerating(true);
                setErrorBanner(null);

                try {
                    const start = new Date(startDate);
                    const month = start.getMonth();
                    const currentSeasonName = (month >= 10 || month <= 1) ? "winter" : (month >= 2 && month <= 5) ? "summer" : "monsoon";
                    const flourOptions = ROTATING_FLOURS[currentSeasonName] || ROTATING_FLOURS['winter'];

                    const dates = Array.from({ length: cycle }).map((_, i) => {
                        const d = new Date(start);
                        d.setDate(start.getDate() + i);
                        return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
                    });

                    const systemPrompt = `RULES: "${directives.join(' | ')}". 
                    CONTEXT: City: ${city}. Dates: ${dates.join(', ')}. Season: ${currentSeasonName}.
                    
                    CRITICAL INSTRUCTIONS:
                    1. STRICTLY follow count rules. E.g., "Rice on 3 weekdays" means exactly 3 weekdays MUST have "lunchSide": "Rice".
                    2. FLOUR LOGIC: If a rule says "Wheat flour roti", output "lunchFlour": "wheat". If it says "Alternate flours", output "dinnerFlour": "alternate".
                    3. "No Dinner" rule: If strict, set "isNoDinner": true.

                    Return JSON Array: [{ 
                        "dayName": string, 
                        "isSpecialLunch": bool, 
                        "isNoDinner": bool, 
                        "lunchSide": "Rice"|"Roti", 
                        "lunchFlour": string|null (e.g. "wheat", "jowar"), 
                        "dinnerFlour": string|null 
                    }]`;

                    let logicPlan = await callGemini(systemPrompt);
                    
                    // Handle cases where LLM might wrap array in an object
                    if (!Array.isArray(logicPlan) && logicPlan.days) logicPlan = logicPlan.days;
                    if (!Array.isArray(logicPlan)) {
                        console.error("Invalid format from AI:", logicPlan);
                        throw new Error("AI returned an invalid menu format. Please try again.");
                    }

                    const getShuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
                    const filterSeasonal = (pool) => pool.filter(item => 
                        !dislikedItems.has(item.name) && 
                        (item.season === 'all' || item.season === currentSeasonName || item.season === 'seasonal' || item.season === 'manual')
                    );
                    
                    const pools = {
                        breakfast: getShuffle(filterSeasonal(repo.breakfast)),
                        dry_veggies: getShuffle(filterSeasonal(repo.dry_veggies)),
                        gravy_veggies: getShuffle(filterSeasonal(repo.gravy_veggies)),
                        dals: repo.dals,
                        heavy_proteins: getShuffle(filterSeasonal(repo.heavy_proteins)),
                        snacks: getShuffle(filterSeasonal(repo.snacks)),
                        special_meals: getShuffle(filterSeasonal(repo.special_meals)),
                        curd: getShuffle(filterSeasonal(repo.curd))
                    };

                    const newMenu = logicPlan.slice(0, cycle).map((plan, i) => {
                        const d = new Date(start);
                        d.setDate(start.getDate() + i);
                        
                        const rotationFlourKey = flourOptions[i % flourOptions.length];
                        const lunchFlourKey = plan.lunchFlour && plan.lunchFlour !== 'alternate' ? plan.lunchFlour : rotationFlourKey;
                        const lunchFlourObj = getFlourDetails(lunchFlourKey);
                        const dinnerFlourKey = plan.dinnerFlour && plan.dinnerFlour !== 'alternate' ? plan.dinnerFlour : rotationFlourKey;
                        const dinnerFlourObj = getFlourDetails(dinnerFlourKey);

                        return {
                            id: i, date: d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
                            dayName: plan.dayName || d.toLocaleDateString('en-IN', { weekday: 'long' }), 
                            isNoDinnerDay: plan.isNoDinner, isSpecialLunchDay: plan.isSpecialLunch,
                            lunchSide: plan.lunchSide === "Rice" ? { en: "Rice", hi: "चावल" } : { en: "Roti", hi: "रोटी" },
                            dinnerSide: { en: "Roti", hi: "रोटी" },
                            lunchFlour: plan.lunchSide === "Roti" ? lunchFlourObj : null,
                            dinnerFlour: dinnerFlourObj,
                            breakfast: pools.breakfast[i % pools.breakfast.length] || repo.breakfast[0],
                            lunch: plan.isSpecialLunch ? { isSpecial: true, main: pools.special_meals[i % pools.special_meals.length] || repo.special_meals[0] } : 
                                   { isSpecial: false, veg: pools.dry_veggies[i % pools.dry_veggies.length] || repo.dry_veggies[0], dal: pools.dals[0] },
                            curd: pools.curd[i % pools.curd.length] || repo.curd[0],
                            snack: plan.isNoDinner ? (pools.special_meals[i % pools.special_meals.length] || repo.special_meals[0]) : (pools.snacks[i % pools.snacks.length] || repo.snacks[0]),
                            dinner: plan.isNoDinner ? null : { main: pools.gravy_veggies[i % pools.gravy_veggies.length] || repo.gravy_veggies[0] }
                        };
                    });

                    const menuObj = { id: Date.now(), timestamp: new Date().toLocaleString(), city, days: newMenu };
                    setHistory([menuObj, ...history].slice(0, 10));
                    setActiveMenu(menuObj);
                    setView('live');
                } catch (err) {
                    console.error(err);
                    setErrorBanner(err.message || "Menu generation failed. Check your API settings.");
                } finally { setIsGenerating(false); }
            };

            const toggleDislike = (name) => {
                const next = new Set(dislikedItems);
                if (next.has(name)) next.delete(name); else next.add(name);
                setDislikedItems(next);
            };

            const saveDirectives = () => {
                setDirectives(tempDirectives.filter(d => d.trim() !== ""));
                setRulesSaved(true);
            };

            const updateMeal = (dayId, path, item) => {
                const updated = JSON.parse(JSON.stringify(activeMenu));
                const day = updated.days.find(d => d.id === dayId);
                const keys = path.split('.');
                if (keys.length === 1) day[keys[0]] = item;
                else day[keys[0]][keys[1]] = item;
                setActiveMenu(updated);
                setHistory(history.map(h => h.id === activeMenu.id ? updated : h));
                setEditingMeal(null);
            };

            if (isSyncing) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
                    <div className="bg-blue-600 p-4 rounded-3xl text-white shadow-2xl pulse-light"><Icon name="ChefHat" size={40} /></div>
                    <p className="text-[10px] font-black uppercase mt-4 text-slate-400 tracking-widest">Logic Master v12.9</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    <aside className="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col no-print h-screen md:sticky md:top-0">
                        <div className="p-6 border-b border-slate-100 flex items-center gap-2">
                                <div className="bg-blue-600 p-1 rounded-lg text-white"><Icon name="ChefHat" size={16} /></div>
                                <h1 className="font-black text-[10px] uppercase tracking-tighter">Kitchen History</h1>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-2">
                            {history.length === 0 ? <p className="text-[10px] text-slate-300 italic p-4 text-center">No cycles yet</p> : history.map(h => (
                                <div key={h.id} className={`p-4 rounded-2xl border cursor-pointer transition-all ${activeMenu?.id === h.id ? 'bg-blue-50 border-blue-200' : 'bg-white'}`} onClick={() => {setActiveMenu(h); setView('live');}}>
                                    <p className="text-[9px] font-black text-blue-600 uppercase tracking-widest">{h.city}</p>
                                    <p className="text-xs font-bold text-slate-700">{h.timestamp.split(',')[0]}</p>
                                </div>
                            ))}
                        </div>
                    </aside>

                    <main className="flex-1 p-6 lg:p-16 max-w-6xl mx-auto">
                        {view === 'plan' ? (
                            <div className="space-y-12 animate-fade-in">
                                <header className="text-center">
                                    <h2 className="text-6xl font-black text-slate-900 leading-none tracking-tighter">Kitchen Intelligence</h2>
                                    <p className="text-slate-400 font-bold uppercase text-[10px] tracking-[0.3em] mt-3 italic">Strict Logic Engine v12.9</p>
                                </header>

                                {/* API Key Input Section with Error Banner */}
                                <div className={`max-w-md mx-auto transition-all ${showApiInput ? 'mb-6' : 'mb-2'}`}>
                                        {errorBanner && (
                                            <div className="bg-red-50 border border-red-200 text-red-600 p-4 rounded-2xl text-xs font-bold mb-4 flex items-center gap-3 error-shake shadow-sm">
                                                <Icon name="AlertTriangle" size={18} />
                                                <span className="flex-1">{errorBanner}</span>
                                                <button onClick={() => setErrorBanner(null)}><Icon name="X" size={14} /></button>
                                            </div>
                                        )}
                                        
                                        <button onClick={() => setShowApiInput(!showApiInput)} className={`text-[10px] font-bold uppercase tracking-widest mx-auto block mb-2 hover:text-blue-500 transition-colors ${!userApiKey && !apiKey ? 'text-red-500 underline' : 'text-slate-400'}`}>
                                        {showApiInput ? "Hide API Settings" : (userApiKey || apiKey) ? "Configure API Settings" : "⚠️ API Key Required: Click here to set up"}
                                        </button>
                                        
                                        {showApiInput && (
                                            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-lg animate-fade-in relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                                <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest block mb-2">Google Gemini API Key</label>
                                                <input 
                                                type="password" 
                                                value={userApiKey} 
                                                onChange={(e) => setUserApiKey(e.target.value)} 
                                                placeholder="Paste your API key from Google AI Studio..."
                                                className="w-full bg-slate-50 p-3 rounded-xl text-xs font-bold border border-slate-200 focus:border-blue-500 outline-none transition-all focus:bg-white"
                                                />
                                                <p className="text-[9px] text-slate-400 mt-2 italic flex items-center gap-1">
                                                <Icon name="Info" size={10} />
                                                This key is required for AI features on GitHub deployments.
                                                </p>
                                            </div>
                                        )}
                                </div>

                                <div className="grid md:grid-cols-3 gap-6 bg-white p-8 rounded-[2.5rem] border-2 border-slate-100">
                                    <div className="space-y-2">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest block ml-2">Location</label>
                                        <input value={city} onChange={e => setCity(e.target.value)} className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border-2 border-transparent focus:border-blue-400 transition-all" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest block ml-2">Plan Start</label>
                                        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full bg-slate-50 p-4 rounded-2xl font-black outline-none border-2 border-transparent focus:border-blue-400 transition-all" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest block ml-2">Cycle (Days)</label>
                                        <div className="flex bg-slate-50 p-1 rounded-2xl">
                                            {[3, 7, 10, 14].map(n => <button key={n} onClick={() => setCycle(n)} className={`flex-1 py-3 rounded-xl text-xs font-black ${cycle === n ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'}`}>{n}</button>)}
                                        </div>
                                    </div>
                                </div>

                                <section className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 shadow-sm space-y-6">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <div className="flex flex-col">
                                            <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                                <Icon name="Brain" size={14} className="text-blue-500" /> 1. Logic Rules
                                            </h3>
                                            {!rulesSaved && <p className="text-[8px] font-black text-orange-500 uppercase mt-1">Changes unsaved</p>}
                                        </div>
                                        <button onClick={saveDirectives} className={`px-6 py-2 rounded-xl text-[10px] font-black uppercase transition-all flex items-center gap-2 ${rulesSaved ? 'bg-slate-100 text-slate-400' : 'bg-green-600 text-white shadow-xl glow-pulse active:scale-95'}`}>
                                            <Icon name="Save" size={14} />
                                            {rulesSaved ? 'Rules Saved' : 'Save Logic'}
                                        </button>
                                    </div>
                                    <div className="space-y-2">
                                        {tempDirectives.map((d, i) => (
                                            <div key={i} className="flex gap-2 group">
                                                <input value={d} onChange={e => {const n = [...tempDirectives]; n[i] = e.target.value; setTempDirectives(n); setRulesSaved(false);}} className="flex-1 bg-slate-50 p-3 rounded-xl text-xs font-bold border-2 border-transparent focus:bg-white focus:border-blue-100 outline-none" />
                                                <button onClick={() => {setTempDirectives(tempDirectives.filter((_, idx) => idx !== i)); setRulesSaved(false);}} className="p-3 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="X" size={16}/></button>
                                            </div>
                                        ))}
                                        <button onClick={() => {setTempDirectives([...tempDirectives, ""]); setRulesSaved(false);}} className="w-full py-4 border-2 border-dashed border-slate-100 rounded-2xl text-[10px] font-black uppercase text-slate-400 hover:text-blue-500 hover:border-blue-100 transition-all">+ Add Rule</button>
                                    </div>
                                </section>

                                <section className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 shadow-sm space-y-6">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2"><Icon name="Filter" size={14} className="text-purple-500" /> 2. Master Dish Selection</h3>
                                        <button onClick={discoverSeasonalDishes} disabled={isExpanding} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all ${isExpanding ? 'bg-slate-100' : 'bg-purple-100 text-purple-600 hover:bg-purple-200 active:scale-95'}`}>
                                            {isExpanding ? "Deep Search Grounding..." : `AI Deep Search: ${city}`}
                                        </button>
                                    </div>

                                    <div className="bg-slate-50 p-6 rounded-[2rem] space-y-4">
                                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Manual Family Dish Entry</p>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            <input value={customDish.name} onChange={e => setCustomDish({...customDish, name: e.target.value})} placeholder="English Name" className="bg-white p-3 rounded-xl text-xs font-bold outline-none" />
                                            <input value={customDish.hi} onChange={e => setCustomDish({...customDish, hi: e.target.value})} placeholder="नाम (हिंदी)" className="bg-white p-3 rounded-xl text-xs font-bold outline-none" />
                                            <select value={customDish.category} onChange={e => setCustomDish({...customDish, category: e.target.value})} className="bg-white p-3 rounded-xl text-xs font-bold border-none outline-none">
                                                {Object.keys(repo).map(k => <option key={k} value={k}>{k.replace('_',' ')}</option>)}
                                            </select>
                                            <button onClick={addManualDish} className="bg-slate-900 text-white rounded-xl text-[10px] font-black uppercase hover:bg-black transition-colors">Add to Library</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 h-[500px] overflow-y-auto pr-4 custom-scrollbar">
                                        {Object.entries(repo).map(([cat, items]) => (
                                            <div key={cat} className="space-y-3">
                                                <div className="flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-md py-2 z-10">
                                                        <p className="text-[10px] font-black text-blue-600 uppercase bg-blue-50 px-3 py-1 rounded-full">{cat.replace('_',' ')}</p>
                                                        <span className="text-[8px] font-black text-slate-300">{items.length} items</span>
                                                </div>
                                                {items.map(item => (
                                                    <label key={item.name} className={`flex items-center gap-3 p-3 rounded-xl border transition-all cursor-pointer ${dislikedItems.has(item.name) ? 'opacity-30 grayscale' : 'bg-white hover:border-blue-200 shadow-sm'}`} onClick={() => toggleDislike(item.name)}>
                                                        <div className={`w-4 h-4 rounded border flex items-center justify-center ${dislikedItems.has(item.name) ? 'bg-slate-300 border-slate-300' : 'bg-blue-600 border-blue-600'}`}>
                                                            {!dislikedItems.has(item.name) && <Icon name="Check" size={10} className="text-white" />}
                                                        </div>
                                                        <div className="flex-1">
                                                            <div className="flex items-center gap-2">
                                                                <p className="text-xs font-black text-slate-800 leading-none">{item.name}</p>
                                                                <span className={`seasonal-tag ${item.season === 'winter' ? 'bg-blue-100 text-blue-600' : item.season === 'summer' ? 'bg-orange-100 text-orange-600' : item.season === 'monsoon' ? 'bg-green-100 text-green-600' : 'bg-slate-100 text-slate-400'}`}>
                                                                    {item.season}
                                                                </span>
                                                            </div>
                                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-1 tracking-wider">{item.hi}</p>
                                                        </div>
                                                    </label>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <button onClick={generateMenu} disabled={isGenerating} className={`w-full py-7 rounded-[3rem] font-black uppercase tracking-[0.2em] shadow-2xl flex items-center justify-center gap-4 text-sm transition-all glow-pulse ${isGenerating ? 'bg-slate-200 text-slate-400' : 'bg-blue-600 text-white hover:scale-[1.01] hover:bg-blue-700 active:scale-95'}`}>
                                    {isGenerating ? (
                                        <><Icon name="Loader2" size={20} className="animate-spin" /> Gemini Analysis & Validation...</>
                                    ) : "Generate Master Menu"}
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-12 animate-fade-in">
                                <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 no-print">
                                    <div>
                                        <h2 className="text-5xl font-black tracking-tighter uppercase leading-none">{activeMenu.city} Cycle</h2>
                                        <div className="flex items-center gap-3 mt-4">
                                            <div className="px-4 py-1 rounded-full text-[8px] font-black uppercase bg-green-50 text-green-600 border border-green-100 flex items-center gap-2 tracking-widest"><Icon name="ShieldCheck" size={12} /> Seasonal Integrity Validated</div>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => window.print()} className="bg-white border border-slate-200 p-4 rounded-2xl hover:bg-slate-50 transition-colors"><Icon name="Printer" size={20}/></button>
                                        <button onClick={() => setView('plan')} className="bg-slate-900 text-white px-10 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-black transition-colors">Reconfigure</button>
                                    </div>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {activeMenu.days.map((day) => (
                                        <div key={day.id} className="bg-white rounded-[3.5rem] border border-slate-100 shadow-2xl shadow-slate-200/50 overflow-hidden flex flex-col relative transition-all hover:shadow-blue-100">
                                            <div className={`px-10 py-7 flex justify-between items-center ${day.isNoDinnerDay ? 'bg-orange-500 text-white' : day.isSpecialLunchDay ? 'bg-purple-600 text-white' : 'bg-slate-900 text-white'}`}>
                                                <div>
                                                    <p className="font-black uppercase tracking-tighter text-2xl">{day.dayName}</p>
                                                    <p className="text-[10px] font-black opacity-70 uppercase tracking-widest mt-1">{day.date} {day.isNoDinnerDay ? '• NO DINNER' : day.isSpecialLunchDay ? '• SPECIAL' : ''}</p>
                                                </div>
                                                <Icon name={day.isNoDinnerDay ? "Zap" : day.isSpecialLunchDay ? "Sparkles" : "ChefHat"} size={28} />
                                            </div>
                                            <div className="p-10 space-y-8 flex-1">
                                                <MealItem icon="Sun" label="Breakfast" item={day.breakfast} yt={getYTLink(day.breakfast.name)} onEdit={() => setEditingMeal({ dayId: day.id, path: 'breakfast', pool: 'breakfast' })} />
                                                <div className="h-px bg-slate-50" />
                                                <div className={`space-y-5 ${day.isSpecialLunchDay ? 'bg-purple-50/50 p-6 rounded-[2.5rem] border border-purple-100' : ''}`}>
                                                    <h3 className={`text-[10px] font-black uppercase tracking-widest ${day.isSpecialLunchDay ? 'text-purple-600' : 'text-slate-400'}`}>Lunch</h3>
                                                    <div className="grid grid-cols-1 gap-6 pl-2">
                                                        {day.lunch.isSpecial ? <MealItem icon="ChefHat" label="AI Chosen Special" item={day.lunch.main} yt={getYTLink(day.lunch.main.name)} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.main', pool: 'special_meals' })} /> : 
                                                            <React.Fragment><MealItem icon="Leaf" label="Dry Sabzi" item={day.lunch.veg} yt={getYTLink(day.lunch.veg.name)} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.veg', pool: 'dry_veggies' })} /><MealItem icon="Waves" label="The Pair (Dal)" item={day.lunch.dal} yt={getYTLink(day.lunch.dal.name)} sub={`Curd: ${day.curd.name}`} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.dal', pool: 'dals' })} /></React.Fragment>}
                                                    </div>
                                                    <SideItem side={day.lunchSide} flour={day.lunchFlour} />
                                                </div>
                                                <div className="h-px bg-slate-50" />
                                                <div className={`space-y-4 ${day.isNoDinnerDay ? 'bg-orange-50 p-6 rounded-[2.5rem] border border-orange-100' : ''}`}>
                                                    <MealItem icon={day.isNoDinnerDay ? "Star" : "MessageSquare"} label={day.isNoDinnerDay ? "Final Feast (No Dinner)" : "Evening Snack"} item={day.snack} yt={getYTLink(day.snack.name)} onEdit={() => setEditingMeal({ dayId: day.id, path: 'snack', pool: day.isNoDinnerDay ? 'special_meals' : 'snacks' })} />
                                                </div>
                                                {day.dinner && <React.Fragment><div className="h-px bg-slate-50" /><div className="space-y-5"><h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Dinner</h3><div className="pl-2"><MealItem icon="Moon" label="Main Gravy" item={day.dinner.main} yt={getYTLink(day.dinner.main.name)} onEdit={() => setEditingMeal({ dayId: day.id, path: 'dinner.main', pool: 'gravy_veggies' })} /></div><SideItem side={day.dinnerSide} flour={day.dinnerFlour} /></div></React.Fragment>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {editingMeal && (
                        <div className="fixed inset-0 z-[1000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-6" onClick={() => setEditingMeal(null)}>
                            <div className="bg-white w-full max-w-lg rounded-[3rem] p-10 max-h-[80vh] flex flex-col shadow-2xl animate-fade-in" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-black mb-6 uppercase tracking-tight flex items-center gap-2"><Icon name="RefreshCw" size={20}/> Swap Dish</h3>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
                                    {repo[editingMeal.pool].filter(i => !dislikedItems.has(i.name)).map(item => (
                                        <button key={item.name} onClick={() => updateMeal(editingMeal.dayId, editingMeal.path, item)} className="w-full text-left p-5 rounded-2xl bg-slate-50 hover:bg-blue-600 hover:text-white transition-all flex justify-between items-center group">
                                            <div>
                                                <p className="font-black text-sm leading-tight">{item.name}</p>
                                                <p className="text-[10px] font-bold opacity-60 uppercase mt-1 tracking-widest">{item.hi}</p>
                                            </div>
                                            <Icon name="ChevronRight" size={16} className="opacity-0 group-hover:opacity-100" />
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setEditingMeal(null)} className="mt-8 py-5 bg-slate-100 text-slate-400 font-black rounded-2xl uppercase text-[10px]">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
