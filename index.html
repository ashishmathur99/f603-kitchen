<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The360 Kitchen | AI Master Engine v12.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-blue-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                    iconRef.current.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                    window.lucide.createIcons({ attrs: { width: size, height: size, 'stroke-width': 2.5, class: className } });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        const getYTLink = (name) => `https://www.youtube.com/results?search_query=${name.replace(/\s+/g, '+')}+recipe+indian+style`;

        const MASTER_REPO = {
            breakfast: [
                { name: "Kanda Poha", hi: "कांदा पोहा", prep: { en: "Wash poha 10 mins before", hi: "पोहा बनाने से 10 मिनट पहले धो लें" } },
                { name: "Aloo Paratha", hi: "आलू पराठा", prep: { en: "Boil potatoes & knead dough", hi: "आलू उबालें और आटा गूंथ लें" } },
                { name: "Methi Thepla", hi: "मेथी थेपला", prep: { en: "Clean & chop fresh methi", hi: "मेथी साफ करके काट लें" } },
                { name: "Besan Chilla", hi: "बेसन चीला", prep: { en: "Keep besan ready", hi: "बेसन तैयार रखें" } },
                { name: "Rava Upma", hi: "रवा उपमा", prep: { en: "Chop carrots & beans", hi: "गाजर और बीन्स काट लें" } },
                { name: "Gobhi Paratha", hi: "गोभी पराठा", prep: { en: "Grate cauliflower tonight", hi: "आज रात गोभी कद्दूकस कर लें" } },
                { name: "Moong Dal Cheela", hi: "मूंग दाल चीला", prep: { en: "Soak Moong Dal tonight", hi: "आज रात मूंग दाल भिगो दें" } },
                { name: "Sabudana Khichdi", hi: "साबूदाना खिचड़ी", prep: { en: "Soak Sabudana tonight", hi: "आज रात साबूदाना भिगो दें" } },
                { name: "Paneer Paratha", hi: "पनीर पराठा" },
                { name: "Mooli Paratha", hi: "मूली पराठा" },
                { name: "Idli Sambar", hi: "इडली सांभर" },
                { name: "Rava Dosa", hi: "रवा डोसा" },
                { name: "Puri Bhaji", hi: "पूरी भाजी" },
                { name: "Vermicelli Upma", hi: "सेवई उपमा" }
            ],
            dry_veggies: [
                { name: "Aloo Gobhi", hi: "आलू गोभी" }, { name: "Bhindi Masala", hi: "भिंडी मसाला" },
                { name: "Jeera Aloo", hi: "जीरा आलू" }, { name: "Baingan Bharta", hi: "बैंगन भरता" },
                { name: "Arbi Masala", hi: "अरबी मसाला" }, { name: "Karela Fry", hi: "करेला फ्राई" },
                { name: "Cabbage Matar", hi: "पत्ता गोभी मटर" }, { name: "Turai (Dry)", hi: "तोरई सुखी" },
                { name: "Kathal Masala", hi: "कटहल मसाला" }, { name: "Lauki Chana Dal", hi: "लौकी चना दाल" },
                { name: "Parwal Aloo", hi: "परवल आलू" }, { name: "Tinda Masala", hi: "टिंडा मसाला" },
                { name: "Gwar Phali", hi: "गवार फली" }, { name: "Matar Mushroom", hi: "मटर मशरूम" }
            ],
            gravy_veggies: [
                { name: "Matar Paneer", hi: "मटर पनीर" }, { name: "Lauki Kofta", hi: "लौकी कोफ्ता" },
                { name: "Dum Aloo", hi: "दम आलू" }, { name: "Palak Paneer", hi: "पालक पनीर" },
                { name: "Mushroom Masala", hi: "मशरूम मसाला" }, { name: "Paneer Butter Masala", hi: "पनीर बटर मसाला" },
                { name: "Malai Kofta", hi: "मलाई कोफ्ता" }, { name: "Kadai Paneer", hi: "कढ़ाई पनीर" },
                { name: "Shahi Paneer", hi: "शाही पनीर" }, { name: "Navratan Korma", hi: "नवरतन कोरमा" },
                { name: "Gatta Curry", hi: "गट्टा करी" }, { name: "Mix Veg Gravy", hi: "मिक्स वेज ग्रेवी" }
            ],
            dals: [
                { name: "Dual Dal Pair (Arhar + Moong Masoor)", hi: "जुगलबंदी दाल (अरहर + मूंग मसूर)", prep: { en: "Soak both Arhar and Moong-Masoor Dals tonight", hi: "आज रात अरहर और मूंग-मसूर दोनों दालें भिगो दें" } }
            ],
            heavy_proteins: [
                { name: "Dal Makhani", hi: "दाल मखनी" }, { name: "Rajma Masala", hi: "राजमा" },
                { name: "Chole (Kabuli Chana)", hi: "छोले" }, { name: "Kala Chana Curry", hi: "काला चना" },
                { name: "Lobia Curry", hi: "लोबिया" }, { name: "White Matar", hi: "सफेद मटर" }
            ],
            snacks: [
                { name: "Roasted Makhana", hi: "मखाना" }, { name: "Sprouts Chaat", hi: "स्प्राउट्स" },
                { name: "Roasted Peanuts", hi: "भुनी मूंगफली" }, { name: "Dhokla", hi: "ढोकला" },
                { name: "Murmura Namkeen", hi: "मुरमुरा" }, { name: "Khandvi", hi: "खांडवी" }
            ],
            special_meals: [
                { name: "Chole Bhature", hi: "छोले भटूरे" }, { name: "Pav Bhaji", hi: "पाव भाजी" },
                { name: "Veg Biryani", hi: "वेज बिरयानी" }, { name: "Paneer Tikka + Rumali Roti", hi: "पनीर टिक्का रुमाली रोटी" },
                { name: "Misal Pav", hi: "मिसल पाव" }, { name: "Hyderabadi Biryani", hi: "हैदराबादी बिरयानी" },
                { name: "Dal Baati", hi: "दाल बाटी" }
            ],
            curd: [
                { name: "Plain Curd", hi: "दही" }, { name: "Boondi Raita", hi: "बूंदी रायता" }, 
                { name: "Mix Veg Raita", hi: "वेजिटेबल रायता" }, { name: "Cucumber Raita", hi: "खीरा रायता" }
            ]
        };

        const AYURVEDA_FLOURS = {
            winter: { en: "Bajra & Makka", hi: "बाजरा और मक्का" },
            summer: { en: "Jowar & Barley", hi: "ज्वार और जौ" },
            monsoon: { en: "Wheat with Bran & Besan", hi: "चोकर वाला गेहूं और बेसन" },
            tropical: { en: "Rice Flour & Ragi", hi: "चावल का आटा और रागी" }
        };

        const App = () => {
            const [view, setView] = useState('plan');
            const [isGenerating, setIsGenerating] = useState(false);
            const [city, setCity] = useState("Delhi");
            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [cycle, setCycle] = useState(7);
            const [isSyncing, setIsSyncing] = useState(true);
            
            const [directives, setDirectives] = useState([
                "Lunch: MUST include both Arhar and Moong-Masoor dal pair",
                "Friday Fun: Heavy snacks in evening with NO separate Dinner",
                "Saturday: Special Meal for Lunch (Chole Bhature/Biryani etc)",
                "Ayurveda: Seasonal flour mix for Rotis"
            ]);
            const [tempDirectives, setTempDirectives] = useState([]);
            const [rulesSaved, setRulesSaved] = useState(true);
            
            const [history, setHistory] = useState([]);
            const [activeMenu, setActiveMenu] = useState(null);
            const [dislikedItems, setDislikedItems] = useState(new Set());
            const [validationReport, setValidationReport] = useState(null);
            const [editingMeal, setEditingMeal] = useState(null);

            const apiKey = "";

            useEffect(() => {
                const syncData = setTimeout(() => {
                    const savedHistory = localStorage.getItem('t360_history_v12_0');
                    if (savedHistory) setHistory(JSON.parse(savedHistory));
                    const savedDislikes = localStorage.getItem('t360_dislikes_v12_0');
                    if (savedDislikes) setDislikedItems(new Set(JSON.parse(savedDislikes)));
                    const savedDirs = localStorage.getItem('t360_dirs_v12_0');
                    if (savedDirs) {
                        const parsed = JSON.parse(savedDirs);
                        setDirectives(parsed);
                        setTempDirectives(parsed);
                    } else {
                        setTempDirectives(directives);
                    }
                    setIsSyncing(false);
                }, 800);
                return () => clearTimeout(syncData);
            }, []);

            useEffect(() => {
                if (!isSyncing) {
                    localStorage.setItem('t360_history_v12_0', JSON.stringify(history));
                    localStorage.setItem('t360_dislikes_v12_0', JSON.stringify([...dislikedItems]));
                    localStorage.setItem('t360_dirs_v12_0', JSON.stringify(directives));
                }
            }, [history, dislikedItems, directives, isSyncing]);

            const callGemini = async (prompt, retryCount = 0) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { 
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            dayName: { type: "STRING" },
                                            isSpecialLunch: { type: "BOOLEAN" },
                                            isNoDinner: { type: "BOOLEAN" },
                                            lunchSide: { type: "STRING", enum: ["Rice", "Roti"] }
                                        },
                                        required: ["dayName", "isSpecialLunch", "isNoDinner", "lunchSide"]
                                    }
                                }
                            }
                        })
                    });
                    
                    if (!response.ok) throw new Error("API call failed");
                    const data = await response.json();
                    return JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || "[]");
                } catch (error) {
                    if (retryCount < 5) {
                        const delay = Math.pow(2, retryCount) * 1000;
                        await new Promise(res => setTimeout(res, delay));
                        return callGemini(prompt, retryCount + 1);
                    }
                    throw error;
                }
            };

            const generateMenu = async () => {
                if (!rulesSaved) {
                    alert("Please save rules before generating.");
                    return;
                }

                setIsGenerating(true);
                setValidationReport(null);

                try {
                    const start = new Date(startDate);
                    const dateList = Array.from({ length: cycle }).map((_, i) => {
                        const d = new Date(start);
                        d.setDate(start.getDate() + i);
                        return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
                    });

                    const systemPrompt = `You are a professional Indian Meal Planner. 
                    Rules provided by the head of the house: "${directives.join(' | ')}".
                    For each of these dates: ${dateList.join(', ')}.
                    Reason through the logic:
                    - If "No Dinner" is mentioned for a day, set isNoDinner: true.
                    - If "Special Meal" or a dish name like "Biryani" is mentioned for a day's lunch, set isSpecialLunch: true.
                    - If the rule says "Lunch MUST include Dual Dal", ensure standard lunch days (isSpecialLunch: false) are planned for that.
                    - Decide if the side should be "Rice" or "Roti" based on any rice rules or usual Indian patterns.
                    Return JSON Array only.`;

                    const logicPlan = await callGemini(systemPrompt);
                    
                    const filterPool = (pool) => pool.filter(item => !dislikedItems.has(item.name));
                    const pools = {
                        breakfast: getShuffle(filterPool(MASTER_REPO.breakfast)),
                        dry_veggies: getShuffle(filterPool(MASTER_REPO.dry_veggies)),
                        gravy_veggies: getShuffle(filterPool(MASTER_REPO.gravy_veggies)),
                        dals: MASTER_REPO.dals, 
                        heavy_proteins: getShuffle(filterPool(MASTER_REPO.heavy_proteins)),
                        snacks: getShuffle(filterPool(MASTER_REPO.snacks)),
                        special_meals: getShuffle(filterPool(MASTER_REPO.special_meals)),
                        curd: getShuffle(filterPool(MASTER_REPO.curd))
                    };

                    const season = (city.toLowerCase().match(/mumbai|chennai|bangalore|bengaluru|kochi|goa/)) ? "tropical" : 
                                   ([10, 11, 0, 1].includes(new Date().getMonth())) ? "winter" : 
                                   ([2, 3, 4, 5].includes(new Date().getMonth())) ? "summer" : "monsoon";
                    const flourMix = AYURVEDA_FLOURS[season];

                    const newMenu = logicPlan.map((plan, i) => {
                        const d = new Date(start);
                        d.setDate(start.getDate() + i);

                        return {
                            id: i,
                            date: d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
                            dayName: plan.dayName,
                            isNoDinnerDay: plan.isNoDinner,
                            isSpecialLunchDay: plan.isSpecialLunch,
                            flourMix,
                            lunchSide: plan.lunchSide === "Rice" ? { en: "Rice", hi: "चावल" } : { en: "Roti", hi: "रोटी" },
                            dinnerSide: { en: "Roti", hi: "रोटी" },
                            breakfast: pools.breakfast[i % pools.breakfast.length],
                            lunch: plan.isSpecialLunch ? {
                                isSpecial: true,
                                main: pools.special_meals[i % pools.special_meals.length]
                            } : {
                                isSpecial: false,
                                veg: pools.dry_veggies[i % pools.dry_veggies.length],
                                dal: pools.dals[0] 
                            },
                            curd: pools.curd[i % pools.curd.length],
                            snack: plan.isNoDinner ? pools.special_meals[i % pools.special_meals.length] : pools.snacks[i % pools.snacks.length],
                            dinner: plan.isNoDinner ? null : { 
                                main: Math.random() > 0.4 
                                    ? pools.gravy_veggies[i % pools.gravy_veggies.length] 
                                    : pools.heavy_proteins[i % pools.heavy_proteins.length]
                            }
                        };
                    });

                    // Prep calculation
                    for (let i = 0; i < newMenu.length; i++) {
                        const nextDay = newMenu[i + 1];
                        const preps = [];
                        if (nextDay) {
                            if (nextDay.breakfast.prep) preps.push(nextDay.breakfast.prep);
                            if (!nextDay.lunch.isSpecial && nextDay.lunch.dal.prep) preps.push(nextDay.lunch.dal.prep);
                            if (nextDay.lunch.isSpecial && nextDay.lunch.main.prep) preps.push(nextDay.lunch.main.prep);
                            if (nextDay.dinner?.main?.prep) preps.push(nextDay.dinner.main.prep);
                        }
                        newMenu[i].nextDayPrep = preps;
                    }

                    const menuObj = { id: Date.now(), timestamp: new Date().toLocaleString(), city, season, days: newMenu };
                    setHistory([menuObj, ...history].slice(0, 10));
                    setActiveMenu(menuObj);
                    setValidationReport({ status: 'success', messages: ['AI successfully integrated and logic synced.'] });
                    setView('live');
                } catch (err) {
                    setValidationReport({ status: 'error', messages: ['API Logic Error. Please check rules and retry.'] });
                } finally {
                    setIsGenerating(false);
                }
            };

            const getShuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            const toggleDislike = (name) => {
                const next = new Set(dislikedItems);
                if (next.has(name)) next.delete(name); else next.add(name);
                setDislikedItems(next);
            };

            const saveDirectives = () => {
                setDirectives(tempDirectives.filter(d => d.trim() !== ""));
                setRulesSaved(true);
            };

            const updateMeal = (dayId, path, item) => {
                const updated = JSON.parse(JSON.stringify(activeMenu));
                const day = updated.days.find(d => d.id === dayId);
                const keys = path.split('.');
                if (keys.length === 1) day[keys[0]] = item;
                else day[keys[0]][keys[1]] = item;
                setActiveMenu(updated);
                setHistory(history.map(h => h.id === activeMenu.id ? updated : h));
                setEditingMeal(null);
            };

            if (isSyncing) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
                    <div className="bg-blue-600 p-4 rounded-3xl text-white mb-6 shadow-2xl pulse-light">
                        <Icon name="ChefHat" size={40} />
                    </div>
                    <p className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">Master Engine v12.0</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    <aside className="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col no-print h-screen md:sticky md:top-0">
                        <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-1.5 rounded-lg text-white shadow-lg shadow-blue-100">
                                    <Icon name="ChefHat" size={18} />
                                </div>
                                <h1 className="font-black text-xs uppercase tracking-tighter">The360 Kitchen</h1>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                            <h2 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4">Saved Cycles</h2>
                            <div className="space-y-3">
                                {history.length === 0 ? <p className="text-[10px] text-slate-400 py-10 text-center border-2 border-dashed border-slate-100 rounded-2xl font-bold italic">No records</p> : history.map(h => (
                                    <div key={h.id} className={`history-card group relative p-4 rounded-2xl border transition-all cursor-pointer ${activeMenu?.id === h.id ? 'border-blue-200 bg-blue-50 shadow-sm' : 'border-slate-100 bg-white'}`} onClick={() => {setActiveMenu(h); setView('live');}}>
                                        <p className="text-[10px] font-black text-blue-600 uppercase tracking-tight">{h.city}</p>
                                        <p className="text-xs font-bold text-slate-800">{h.timestamp.split(',')[0]}</p>
                                        <button onClick={(e) => {e.stopPropagation(); setHistory(history.filter(item => item.id !== h.id));}} className="delete-btn opacity-0 absolute top-3 right-3 p-1 text-slate-300 hover:text-red-500 transition-opacity"><Icon name="Trash2" size={14} /></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 p-6 md:p-12 lg:p-16 max-w-6xl mx-auto">
                        {view === 'plan' ? (
                            <div className="space-y-12 animate-fade-in">
                                <div className="text-center">
                                    <h2 className="text-5xl font-black tracking-tighter text-slate-900 mb-4 leading-none">Smart Meal Planner</h2>
                                    <p className="text-slate-500 font-medium italic">Gemini 2.5 Logic • Exhaustive Indian Menu</p>
                                </div>

                                <section className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 shadow-sm space-y-6">
                                    <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                        <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                            <Icon name="Brain" size={14} className="text-blue-500" /> 1. Conversational Logic
                                        </h3>
                                        <button onClick={saveDirectives} className={`px-6 py-2 rounded-xl font-black uppercase text-[10px] transition-all flex items-center gap-2 ${rulesSaved ? 'bg-slate-100 text-slate-400' : 'bg-green-600 text-white shadow-xl'}`}>
                                            <Icon name="Save" size={14} /> Save Rules
                                        </button>
                                    </div>
                                    <div className="space-y-2">
                                        {tempDirectives.map((d, i) => (
                                            <div key={i} className="flex gap-2">
                                                <input value={d} onChange={e => {const n = [...tempDirectives]; n[i] = e.target.value; setTempDirectives(n); setRulesSaved(false);}} placeholder="e.g. Rice only on Sundays" className="flex-1 bg-slate-50 p-3 rounded-xl text-xs font-bold text-slate-700 outline-none border border-slate-100 focus:border-blue-400 focus:bg-white transition-all" />
                                                <button onClick={() => {setTempDirectives(tempDirectives.filter((_, idx) => idx !== i)); setRulesSaved(false);}} className="p-3 text-slate-300 hover:text-red-500"><Icon name="X" size={16} /></button>
                                            </div>
                                        ))}
                                        <button onClick={() => {setTempDirectives([...tempDirectives, ""]); setRulesSaved(false);}} className="w-full py-4 border-2 border-dashed border-slate-100 rounded-xl text-[10px] font-black uppercase text-slate-400 hover:border-blue-200 hover:text-blue-500 transition-all">+ Add Logic Constraint</button>
                                    </div>
                                </section>

                                <section className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 shadow-sm space-y-6">
                                    <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                        <Icon name="Filter" size={14} className="text-purple-500" /> 2. Exhaustive Dish Selection
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 h-[400px] overflow-y-auto pr-4 custom-scrollbar">
                                        {Object.entries(MASTER_REPO).map(([category, items]) => (
                                            <div key={category} className="space-y-3">
                                                <p className="text-[10px] font-black text-blue-600 uppercase bg-blue-50 px-3 py-1 rounded-full inline-block">{category}</p>
                                                <div className="flex flex-col gap-1">
                                                    {items.map(item => (
                                                        <label key={item.name} className={`flex items-center gap-3 p-3 rounded-xl border transition-all cursor-pointer ${dislikedItems.has(item.name) ? 'opacity-30 bg-slate-50' : 'bg-white border-slate-100 hover:border-blue-200'}`} onClick={() => toggleDislike(item.name)}>
                                                            <div className={`w-4 h-4 rounded border flex items-center justify-center ${dislikedItems.has(item.name) ? 'bg-slate-300' : 'bg-blue-600 border-blue-600'}`}>
                                                                {!dislikedItems.has(item.name) && <Icon name="Check" size={10} className="text-white" />}
                                                            </div>
                                                            <div>
                                                                <p className="text-xs font-bold text-slate-800 leading-none">{item.name}</p>
                                                                <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">{item.hi}</p>
                                                            </div>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <div className="grid md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest block mb-2">City</label>
                                        <input value={city} onChange={e => setCity(e.target.value)} className="w-full bg-slate-50 p-4 rounded-2xl font-black text-slate-800 outline-none" />
                                    </div>
                                    <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest block mb-2">Start Date</label>
                                        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full bg-slate-50 p-4 rounded-2xl font-black text-slate-800 outline-none" />
                                    </div>
                                    <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest block mb-2">Days</label>
                                        <div className="flex bg-slate-50 p-1 rounded-xl">
                                            {[3, 7, 10, 14].map(n => <button key={n} onClick={() => setCycle(n)} className={`flex-1 py-3 rounded-lg text-xs font-black transition-all ${cycle === n ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'}`}>{n}D</button>)}
                                        </div>
                                    </div>
                                </div>

                                <button onClick={generateMenu} disabled={isGenerating} className={`w-full py-6 rounded-[2.5rem] font-black uppercase tracking-widest shadow-2xl flex items-center justify-center gap-4 text-sm transition-all ${isGenerating ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700 hover:scale-[1.01]'}`}>
                                    {isGenerating ? <React.Fragment><Icon name="Loader2" className="animate-spin" /> AI Validating Rules...</React.Fragment> : <React.Fragment><Icon name="Zap" /> Generate Logic-Synced Menu</React.Fragment>}
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-12 animate-fade-in">
                                <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 no-print">
                                    <div>
                                        <h2 className="text-4xl font-black tracking-tight uppercase leading-none">{activeMenu.city} Cycle</h2>
                                        <div className="flex items-center gap-3 mt-3">
                                            <p className="text-slate-400 font-bold uppercase text-[10px] tracking-widest italic">AI Validated v12.0</p>
                                            <div className="px-3 py-1 rounded-full text-[8px] font-black uppercase bg-green-50 text-green-600 border border-green-100 flex items-center gap-1.5"><Icon name="ShieldCheck" size={10} /> Logic Adhered</div>
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => window.print()} className="bg-white border border-slate-200 p-4 rounded-2xl hover:bg-slate-50 shadow-sm"><Icon name="Printer" size={20} /></button>
                                        <button onClick={() => setView('plan')} className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest">Adjust</button>
                                    </div>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {activeMenu.days.map((day) => (
                                        <div key={day.id} className="bg-white rounded-[3rem] border border-slate-200 shadow-xl shadow-slate-200/50 overflow-hidden flex flex-col relative">
                                            <div className={`px-8 py-5 flex justify-between items-center ${day.isNoDinnerDay ? 'bg-orange-500 text-white' : day.isSpecialLunchDay ? 'bg-purple-600 text-white' : 'bg-slate-900 text-white'}`}>
                                                <div>
                                                    <p className="font-black uppercase tracking-tighter text-xl">{day.dayName}</p>
                                                    <p className="text-[10px] font-bold opacity-60 uppercase tracking-widest">{day.date} {day.isNoDinnerDay ? '• NO DINNER' : day.isSpecialLunchDay ? '• SPECIAL' : ''}</p>
                                                </div>
                                                <Icon name={day.isNoDinnerDay ? "Zap" : day.isSpecialLunchDay ? "Sparkles" : "ChefHat"} size={24} />
                                            </div>
                                            <div className="p-8 space-y-8 flex-1">
                                                <MealItem icon="Sun" label="Breakfast" item={day.breakfast} onEdit={() => setEditingMeal({ dayId: day.id, path: 'breakfast', pool: 'breakfast' })} yt={getYTLink(day.breakfast.name)} />
                                                <div className="h-px bg-slate-50" />
                                                <div className={`space-y-5 ${day.isSpecialLunchDay ? 'bg-purple-50/50 p-4 rounded-[2rem] border border-purple-100' : ''}`}>
                                                    <h3 className={`text-[10px] font-black uppercase tracking-widest ${day.isSpecialLunchDay ? 'text-purple-600' : 'text-slate-400'}`}>Lunch</h3>
                                                    <div className="grid grid-cols-1 gap-6 pl-2">
                                                        {day.lunch.isSpecial ? <MealItem icon="ChefHat" label="Special Meal" item={day.lunch.main} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.main', pool: 'special_meals' })} yt={getYTLink(day.lunch.main.name)} /> : <React.Fragment><MealItem icon="Leaf" label="Dry Sabzi" item={day.lunch.veg} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.veg', pool: 'dry_veggies' })} yt={getYTLink(day.lunch.veg.name)} /><MealItem icon="Waves" label="The Pair (Dal)" item={day.lunch.dal} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.dal', pool: 'dals' })} yt={getYTLink(day.lunch.dal.name)} sub={`Curd: ${day.curd.name}`} /></React.Fragment>}
                                                    </div>
                                                    <SideItem side={day.lunchSide} flour={day.flourMix} />
                                                </div>
                                                <div className="h-px bg-slate-50" />
                                                <div className={`space-y-4 ${day.isNoDinnerDay ? 'bg-orange-50 p-4 rounded-[2rem] border border-orange-100 shadow-sm' : ''}`}>
                                                    <MealItem icon={day.isNoDinnerDay ? "Star" : "MessageSquare"} label={day.isNoDinnerDay ? "Final Heavy Feast" : "Evening Snack"} item={day.snack} onEdit={() => setEditingMeal({ dayId: day.id, path: 'snack', pool: day.isNoDinnerDay ? 'special_meals' : 'snacks' })} yt={getYTLink(day.snack.name)} />
                                                </div>
                                                {day.dinner && <React.Fragment><div className="h-px bg-slate-50" /><div className="space-y-5"><h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Dinner</h3><div className="pl-2"><MealItem icon="Moon" label="Main Gravy" item={day.dinner.main} onEdit={() => setEditingMeal({ dayId: day.id, path: 'dinner.main', pool: 'gravy_veggies' })} yt={getYTLink(day.dinner.main.name)} /></div><SideItem side={day.dinnerSide} flour={day.flourMix} /></div></React.Fragment>}
                                                <div className="mt-8 pt-6 border-t border-slate-100 bg-orange-50/50 rounded-2xl p-5 border border-orange-100">
                                                    <h4 className="text-[10px] font-black uppercase text-orange-600 tracking-widest flex items-center gap-2 mb-3"><Icon name="Bell" size={14} /> Cook: Prep for Tomorrow</h4>
                                                    <div className="space-y-2">{day.nextDayPrep && day.nextDayPrep.length > 0 ? day.nextDayPrep.map((prep, pIdx) => (<div key={pIdx} className="flex flex-col"><p className="text-xs font-bold text-slate-700 leading-tight">• {prep.en}</p><p className="text-[10px] font-bold text-orange-600 mt-0.5 ml-3 italic">{prep.hi}</p></div>)) : <p className="text-xs text-slate-400 italic">No special prep needed.</p>}</div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {editingMeal && (
                        <div className="fixed inset-0 z-[1000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-6" onClick={() => setEditingMeal(null)}>
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] p-10 max-h-[80vh] flex flex-col shadow-2xl animate-fade-in" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-black mb-6 uppercase tracking-tight">Swap Item</h3>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
                                    {MASTER_REPO[editingMeal.pool].filter(i => !dislikedItems.has(i.name)).map(item => (
                                        <button key={item.name} onClick={() => updateMeal(editingMeal.dayId, editingMeal.path, item)} className="w-full text-left p-5 rounded-2xl bg-slate-50 hover:bg-blue-600 hover:text-white transition-all flex justify-between items-center group">
                                            <div><p className="font-black text-sm leading-tight">{item.name}</p><p className="text-[10px] font-bold opacity-60 uppercase mt-1">{item.hi}</p></div>
                                            <Icon name="ChevronRight" size={16} className="opacity-0 group-hover:opacity-100" />
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setEditingMeal(null)} className="mt-8 py-4 bg-slate-100 text-slate-400 font-black rounded-xl uppercase text-[10px]">Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MealItem = ({ icon, label, item, onEdit, yt, sub }) => (
            <div className="flex items-center justify-between group">
                <div className="flex items-start gap-4">
                    <div className="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center shrink-0 group-hover:bg-blue-50 transition-colors"><Icon name={icon} size={20} /></div>
                    <div>
                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-0.5">{label}</p>
                        <p className="font-black text-slate-800 leading-tight text-sm">{item.name}</p>
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-tight mt-0.5">{item.hi}</p>
                        {sub && <p className="text-[9px] font-black text-blue-500 uppercase mt-1 italic leading-tight">{sub}</p>}
                    </div>
                </div>
                <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onClick={onEdit} className="w-10 h-10 rounded-lg bg-slate-100 text-slate-400 hover:text-blue-600 transition-all flex items-center justify-center no-print shadow-sm"><Icon name="Edit3" size={16} /></button>
                    <a href={yt} target="_blank" className="w-10 h-10 rounded-lg bg-red-50 text-red-500 hover:bg-red-500 transition-all flex items-center justify-center no-print shadow-sm"><Icon name="Youtube" size={18} /></a>
                </div>
            </div>
        );

        const SideItem = ({ side, flour }) => (
            <div className="flex items-center gap-4 ml-14 bg-slate-50 border border-slate-100 rounded-2xl p-4 shadow-sm relative overflow-hidden group">
                <div className="w-1 h-full bg-blue-500 absolute left-0 top-0" />
                <div className="flex flex-col flex-1">
                    <div className="flex items-baseline gap-2 mb-1">
                        <p className="font-black text-slate-800 text-sm tracking-tight uppercase leading-none">{side.en}</p>
                        <p className="text-[10px] font-bold text-slate-400 uppercase italic">/ {side.hi}</p>
                    </div>
                    {side.en === "Roti" && (<div className="flex flex-col mt-1 border-t border-slate-200 pt-1"><p className="text-[8px] font-black text-blue-600 uppercase tracking-widest leading-none mb-1">Seasonal Flour | आटे का मिश्रण</p><p className="text-[10px] font-black text-slate-700 leading-tight">{flour.en}</p><p className="text-[9px] font-bold text-slate-400 mt-0.5 leading-tight italic">{flour.hi}</p></div>)}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
