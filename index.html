<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The360 Kitchen | Master Engine v11.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .history-card:hover .delete-btn { opacity: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .pulse-light { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-blue-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                    iconRef.current.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                    window.lucide.createIcons({ attrs: { width: size, height: size, 'stroke-width': 2.5, class: className } });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        const getYTLink = (name) => `https://www.youtube.com/results?search_query=${name.replace(/\s+/g, '+')}+recipe+indian+style`;

        const AYURVEDA_FLOURS = {
            winter: { en: "Bajra & Makka (Heating)", hi: "बाजरा और मक्का (गरम तासीर)" },
            summer: { en: "Jowar & Barley (Cooling)", hi: "ज्वार और जौ (ठंडी तासीर)" },
            monsoon: { en: "Wheat with Bran & Besan", hi: "चोकर वाला गेहूं और बेसन" },
            tropical: { en: "Rice Flour & Ragi", hi: "चावल का आटा और रागी" }
        };

        const MASTER_REPO = {
            breakfast: [
                { name: "Kanda Poha", hi: "कांदा पोहा", prep: { en: "Wash poha 10 mins before", hi: "पोहा बनाने से 10 मिनट पहले धो लें" } },
                { name: "Aloo Paratha", hi: "आलू पराठा", prep: { en: "Boil potatoes & knead dough", hi: "आलू उबालें और आटा गूंथ लें" } },
                { name: "Methi Thepla", hi: "मेथी थेपला", prep: { en: "Clean & chop fresh methi", hi: "मेथी साफ करके काट लें" } },
                { name: "Besan Chilla", hi: "बेसन चीला", prep: { en: "Keep besan ready", hi: "बेसन तैयार रखें" } },
                { name: "Rava Upma", hi: "रवा उपमा", prep: { en: "Chop carrots & beans", hi: "गाजर और बीन्स काट लें" } },
                { name: "Gobhi Paratha", hi: "गोभी पराठा", prep: { en: "Grate cauliflower tonight", hi: "आज रात गोभी कद्दूकस कर लें" } },
                { name: "Moong Dal Cheela", hi: "मूंग दाल चीला", prep: { en: "Soak Moong Dal tonight", hi: "आज रात मूंग दाल भिगो दें" } },
                { name: "Sabudana Khichdi", hi: "साबूदाना खिचड़ी", prep: { en: "Soak Sabudana tonight", hi: "आज रात साबूदाना भिगो दें" } }
            ],
            dry_veggies: [
                { name: "Aloo Gobhi", hi: "आलू गोभी" },
                { name: "Bhindi Masala", hi: "भिंडी मसाला" },
                { name: "Jeera Aloo", hi: "जीरा आलू" },
                { name: "Beans Aloo", hi: "बीन्स आलू" },
                { name: "Baingan Bharta", hi: "बैंगन भरता", prep: { en: "Roast brinjal tonight", hi: "आज रात बैंगन भून लें" } },
                { name: "Arbi Masala", hi: "अरबी मसाला" },
                { name: "Karela Fry", hi: "करेला फ्राई", prep: { en: "Salt & squeeze bitter gourd", hi: "करेले में नमक लगाकर निचोड़ दें" } },
                { name: "Cabbage Matar", hi: "पत्ता गोभी मटर" },
                { name: "Turai (Dry)", hi: "तोरई सुखी" }
            ],
            gravy_veggies: [
                { name: "Matar Paneer", hi: "मटर पनीर" },
                { name: "Lauki Kofta", hi: "लौकी कोफ्ता", prep: { en: "Grate Lauki for kofta", hi: "कोफ्ते के लिए लौकी कद्दूकस कर लें" } },
                { name: "Dum Aloo", hi: "दम आलू", prep: { en: "Boil small potatoes", hi: "छोटे आलू उबाल लें" } },
                { name: "Palak Paneer", hi: "पालक पनीर", prep: { en: "Blanch & puree spinach", hi: "पालक उबालकर प्यूरी बना लें" } },
                { name: "Mushroom Masala", hi: "मशरूम मसाला" },
                { name: "Paneer Butter Masala", hi: "पनीर बटर मसाला" },
                { name: "Malai Kofta", hi: "मलाई कोफ्ता", prep: { en: "Prepare kofta balls", hi: "कोफ्ते के गोले तैयार करें" } }
            ],
            dals: [
                { name: "Dual Dal Pair (Arhar + Moong Masoor)", hi: "जुगलबंदी दाल (अरहर + मूंग मसूर)", prep: { en: "Soak both Arhar and Moong-Masoor Dals tonight", hi: "आज रात अरहर और मूंग-मसूर दोनों दालें भिगो दें" } }
            ],
            heavy_proteins: [
                { name: "Dal Makhani", hi: "दाल मखनी", prep: { en: "Soak Black Urad tonight", hi: "आज रात काली उड़द भिगो दें" } },
                { name: "Rajma Masala", hi: "राजमा", prep: { en: "Soak Rajma tonight", hi: "आज रात राजमा भिगो दें" } },
                { name: "Chole (Kabuli Chana)", hi: "छोले", prep: { en: "Soak Kabuli Chana tonight", hi: "आज रात काबुली चना भिगो दें" } },
                { name: "Kala Chana Curry", hi: "काला चना", prep: { en: "Soak Kala Chana tonight", hi: "आज रात काला चना भिगो दें" } }
            ],
            snacks: [
                { name: "Roasted Makhana", hi: "मखाना" },
                { name: "Sprouts Chaat", hi: "स्प्राउट्स", prep: { en: "Start sprouting mung tonight", hi: "आज रात मूंग अंकुरित करने के लिए रख दें" } },
                { name: "Roasted Peanuts", hi: "भुनी मूंगफली" },
                { name: "Murmura Namkeen", hi: "मुरमुरा" }
            ],
            special_meals: [
                { name: "Chole Bhature", hi: "छोले भटूरे", prep: { en: "Soak Chole & prepare dough", hi: "छोले भिगोएं और आटा तैयार करें" } },
                { name: "Pav Bhaji", hi: "पाव भाजी", prep: { en: "Boil mix veggies tonight", hi: "आज रात मिक्स सब्जियां उबाल लें" } },
                { name: "Veg Biryani", hi: "वेज बिरयानी", prep: { en: "Soak Basmati Rice", hi: "बासमती चावल भिगो दें" } },
                { name: "Paneer Tikka + Rumali Roti", hi: "पनीर टिक्का रुमाली रोटी", prep: { en: "Marinate Paneer", hi: "पनीर को मैरीनेट करें" } },
                { name: "Dal Baati", hi: "दाल बाटी", prep: { en: "Prepare baati dough", hi: "बाटी का आटा तैयार करें" } },
                { name: "Misal Pav", hi: "मिसल पाव", prep: { en: "Soak moth beans tonight", hi: "आज रात मठ भिगो दें" } }
            ],
            curd: [
                { name: "Plain Curd", hi: "दही" },
                { name: "Boondi Raita", hi: "बूंदी रायता" },
                { name: "Mix Veg Raita", hi: "वेजिटेबल रायता" }
            ]
        };

        const App = () => {
            const [view, setView] = useState('plan');
            const [city, setCity] = useState("Delhi");
            const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [cycle, setCycle] = useState(7);
            const [isSyncing, setIsSyncing] = useState(true);
            const [directives, setDirectives] = useState([
                "Lunch: MUST include both Arhar and Moong-Masoor dal pair",
                "Friday Fun: Heavy snacks in evening with NO separate Dinner",
                "Saturday: Special Meal for Lunch (Chole Bhature/Biryani etc)",
                "Ayurveda: Seasonal flour mix for Rotis"
            ]);
            
            const [history, setHistory] = useState([]);
            const [activeMenu, setActiveMenu] = useState(null);
            const [dislikedItems, setDislikedItems] = useState(new Set());
            const [showPrefs, setShowPrefs] = useState(false);
            const [editingMeal, setEditingMeal] = useState(null);

            useEffect(() => {
                const syncData = setTimeout(() => {
                    const savedHistory = localStorage.getItem('t360_history_v11_5');
                    if (savedHistory) setHistory(JSON.parse(savedHistory));
                    const savedDislikes = localStorage.getItem('t360_dislikes_v11_5');
                    if (savedDislikes) setDislikedItems(new Set(JSON.parse(savedDislikes)));
                    const savedDirs = localStorage.getItem('t360_dirs_v11_5');
                    if (savedDirs) setDirectives(JSON.parse(savedDirs));
                    setIsSyncing(false);
                }, 800);
                return () => clearTimeout(syncData);
            }, []);

            useEffect(() => {
                if (!isSyncing) {
                    localStorage.setItem('t360_history_v11_5', JSON.stringify(history));
                    localStorage.setItem('t360_dislikes_v11_5', JSON.stringify([...dislikedItems]));
                    localStorage.setItem('t360_dirs_v11_5', JSON.stringify(directives));
                }
            }, [history, dislikedItems, directives, isSyncing]);

            const getShuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            const generateMenu = () => {
                const filterPool = (pool) => pool.filter(item => !dislikedItems.has(item.name));
                
                const pools = {
                    breakfast: getShuffle(filterPool(MASTER_REPO.breakfast)),
                    dry_veggies: getShuffle(filterPool(MASTER_REPO.dry_veggies)),
                    gravy_veggies: getShuffle(filterPool(MASTER_REPO.gravy_veggies)),
                    dals: MASTER_REPO.dals, 
                    heavy_proteins: getShuffle(filterPool(MASTER_REPO.heavy_proteins)),
                    snacks: getShuffle(filterPool(MASTER_REPO.snacks)),
                    special_meals: getShuffle(filterPool(MASTER_REPO.special_meals)),
                    curd: getShuffle(filterPool(MASTER_REPO.curd))
                };

                const season = (city.toLowerCase().match(/mumbai|chennai|bangalore|bengaluru|kochi|goa/)) ? "tropical" : 
                               ([10, 11, 0, 1].includes(new Date().getMonth())) ? "winter" : 
                               ([2, 3, 4, 5].includes(new Date().getMonth())) ? "summer" : "monsoon";

                const flourMix = AYURVEDA_FLOURS[season];
                const newMenu = [];
                const start = new Date(startDate);

                for (let i = 0; i < cycle; i++) {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    const dayOfWeek = d.getDay(); // 0=Sun, 1=Mon... 5=Fri, 6=Sat

                    const isFriday = dayOfWeek === 5;
                    const isSaturday = dayOfWeek === 6;

                    newMenu.push({
                        id: i,
                        date: d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
                        dayName: d.toLocaleDateString('en-IN', { weekday: 'long' }),
                        isFriday,
                        isSaturday,
                        flourMix,
                        lunchSide: { en: "Roti", hi: "रोटी" }, 
                        dinnerSide: { en: "Roti", hi: "रोटी" },
                        breakfast: pools.breakfast[i % pools.breakfast.length],
                        lunch: isSaturday ? {
                            isSpecial: true,
                            main: pools.special_meals[i % pools.special_meals.length]
                        } : {
                            isSpecial: false,
                            veg: pools.dry_veggies[i % pools.dry_veggies.length],
                            dal: pools.dals[0] 
                        },
                        curd: pools.curd[i % pools.curd.length],
                        snack: isFriday ? pools.special_meals[i % pools.special_meals.length] : pools.snacks[i % pools.snacks.length],
                        dinner: isFriday ? null : { 
                            main: Math.random() > 0.4 
                                ? pools.gravy_veggies[i % pools.gravy_veggies.length] 
                                : pools.heavy_proteins[i % pools.heavy_proteins.length]
                        }
                    });
                }

                // Add prep notes from the *next* day's items
                for (let i = 0; i < newMenu.length; i++) {
                    const nextDay = newMenu[i + 1];
                    const preps = [];
                    if (nextDay) {
                        if (nextDay.breakfast.prep) preps.push(nextDay.breakfast.prep);
                        if (!nextDay.lunch.isSpecial && nextDay.lunch.dal.prep) preps.push(nextDay.lunch.dal.prep);
                        if (nextDay.lunch.isSpecial && nextDay.lunch.main.prep) preps.push(nextDay.lunch.main.prep);
                        if (nextDay.dinner?.main?.prep) preps.push(nextDay.dinner.main.prep);
                        if (nextDay.snack?.prep) preps.push(nextDay.snack.prep);
                    }
                    newMenu[i].nextDayPrep = preps;
                }

                const menuObj = { id: Date.now(), timestamp: new Date().toLocaleString(), city, season, days: newMenu };
                setHistory([menuObj, ...history].slice(0, 10));
                setActiveMenu(menuObj);
                setView('live');
            };

            const updateMeal = (dayId, path, item) => {
                const updated = JSON.parse(JSON.stringify(activeMenu));
                const day = updated.days.find(d => d.id === dayId);
                const keys = path.split('.');
                if (keys.length === 1) day[keys[0]] = item;
                else day[keys[0]][keys[1]] = item;
                setActiveMenu(updated);
                setHistory(history.map(h => h.id === activeMenu.id ? updated : h));
                setEditingMeal(null);
            };

            if (isSyncing) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
                    <div className="bg-blue-600 p-4 rounded-3xl text-white mb-6 shadow-2xl pulse-light">
                        <Icon name="ChefHat" size={40} />
                    </div>
                    <p className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">Syncing Master v11.5</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    <aside className="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col no-print h-screen md:sticky md:top-0">
                        <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-1.5 rounded-lg text-white shadow-lg">
                                    <Icon name="ChefHat" size={18} />
                                </div>
                                <h1 className="font-black text-xs uppercase tracking-tighter">The360 Kitchen</h1>
                            </div>
                            <button onClick={() => setShowPrefs(!showPrefs)} className={`p-2 rounded-lg transition-colors ${showPrefs ? 'bg-blue-50 text-blue-600' : 'text-slate-400'}`}>
                                <Icon name="Settings" size={18} />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                            {!showPrefs ? (
                                <div className="space-y-6">
                                    <h2 className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Recent Cycles</h2>
                                    <div className="space-y-3">
                                        {history.length === 0 ? <p className="text-[10px] text-slate-400 font-bold uppercase py-10 text-center border-2 border-dashed border-slate-100 rounded-2xl">Empty</p> : history.map(h => (
                                            <div key={h.id} className={`history-card group relative p-4 rounded-2xl border transition-all cursor-pointer ${activeMenu?.id === h.id ? 'border-blue-200 bg-blue-50/30 shadow-sm' : 'border-slate-100 bg-white'}`} onClick={() => {setActiveMenu(h); setView('live');}}>
                                                <p className="text-[10px] font-black text-blue-600 uppercase tracking-tight">{h.city}</p>
                                                <p className="text-xs font-bold text-slate-800">{h.timestamp.split(',')[0]}</p>
                                                <button onClick={(e) => {e.stopPropagation(); setHistory(history.filter(item => item.id !== h.id));}} className="delete-btn opacity-0 absolute top-3 right-3 p-1 text-slate-300 hover:text-red-500 transition-opacity"><Icon name="Trash2" size={14} /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-6 animate-fade-in">
                                    <h2 className="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                        <Icon name="Filter" size={12} /> Preference Filter
                                    </h2>
                                    {Object.entries(MASTER_REPO).map(([key, items]) => (
                                        <div key={key} className="space-y-2">
                                            <p className="text-[9px] font-bold text-blue-500 uppercase px-1">{key.replace('_',' ')}</p>
                                            <div className="flex flex-wrap gap-1.5">
                                                {items.map(item => (
                                                    <button 
                                                        key={item.name}
                                                        onClick={() => {
                                                            const next = new Set(dislikedItems);
                                                            if (next.has(item.name)) next.delete(item.name); else next.add(item.name);
                                                            setDislikedItems(next);
                                                        }}
                                                        className={`px-3 py-1.5 rounded-xl text-[10px] font-bold border transition-all ${dislikedItems.has(item.name) ? 'bg-red-50 border-red-100 text-red-400 line-through' : 'bg-slate-50 border-slate-100 text-slate-600'}`}
                                                    >
                                                        {item.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => setShowPrefs(false)} className="w-full py-3 bg-slate-900 text-white rounded-xl text-[10px] font-black uppercase tracking-widest">Back</button>
                                </div>
                            )}
                        </div>
                    </aside>

                    <main className="flex-1 p-6 md:p-12 lg:p-16 max-w-5xl mx-auto">
                        {view === 'plan' ? (
                            <div className="space-y-12 animate-fade-in">
                                <div className="text-center">
                                    <h2 className="text-5xl font-black tracking-tighter text-slate-900 mb-4 leading-none">Indian Menu Planner</h2>
                                    <p className="text-slate-500 font-medium italic">Friday Fun Night • Saturday Special • Dual Dal</p>
                                </div>

                                <section className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 shadow-sm space-y-6">
                                    <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                        <Icon name="Activity" size={14} className="text-blue-500" /> Editable System Directives
                                    </h3>
                                    <div className="space-y-2">
                                        {directives.map((d, i) => (
                                            <div key={i} className="flex gap-2">
                                                <input value={d} onChange={e => {const n = [...directives]; n[i] = e.target.value; setDirectives(n);}} className="flex-1 bg-slate-50 p-3 rounded-xl text-xs font-bold text-slate-700 outline-none border border-slate-100 focus:border-blue-400" />
                                                <button onClick={() => setDirectives(directives.filter((_, idx) => idx !== i))} className="p-3 text-slate-300 hover:text-red-500"><Icon name="X" size={16} /></button>
                                            </div>
                                        ))}
                                        <button onClick={() => setDirectives([...directives, "Add new rule..."])} className="text-[9px] font-black uppercase text-blue-600 bg-blue-50 px-4 py-2 rounded-lg mt-2">+ Add Logic Rule</button>
                                    </div>
                                </section>

                                <div className="grid md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm space-y-2">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest ml-2">City</label>
                                        <input value={city} onChange={e => setCity(e.target.value)} className="w-full bg-slate-50 p-4 rounded-2xl font-black text-slate-800 outline-none" />
                                    </div>
                                    <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm space-y-2">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest ml-2">Start Date</label>
                                        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full bg-slate-50 p-4 rounded-2xl font-black text-slate-800 outline-none" />
                                    </div>
                                    <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm space-y-2">
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest ml-2">Cycle</label>
                                        <div className="flex bg-slate-50 p-1 rounded-xl">
                                            {[3, 7, 10].map(n => <button key={n} onClick={() => setCycle(n)} className={`flex-1 py-3 rounded-lg text-xs font-black transition-all ${cycle === n ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'}`}>{n}D</button>)}
                                        </div>
                                    </div>
                                </div>

                                <button onClick={generateMenu} className="w-full py-6 bg-blue-600 text-white rounded-[2.5rem] font-black uppercase tracking-widest shadow-2xl hover:bg-blue-700 transition-all flex items-center justify-center gap-4 text-sm">
                                    <Icon name="Zap" /> Apply Rules & Generate
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-12 animate-fade-in">
                                <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 no-print">
                                    <div>
                                        <h2 className="text-4xl font-black tracking-tight uppercase leading-none">{activeMenu.city} Cycle</h2>
                                        <p className="text-slate-400 font-bold uppercase text-[10px] tracking-[0.2em] mt-2 italic">Standard logic + Specialized Fridays & Saturdays</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => window.print()} className="bg-white border border-slate-200 p-4 rounded-2xl hover:bg-slate-50 shadow-sm"><Icon name="Printer" size={20} /></button>
                                        <button onClick={() => setView('plan')} className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest">Adjust</button>
                                    </div>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {activeMenu.days.map((day) => (
                                        <div key={day.id} className="bg-white rounded-[3rem] border border-slate-200 shadow-xl shadow-slate-200/50 overflow-hidden flex flex-col relative">
                                            <div className={`px-8 py-5 flex justify-between items-center ${day.isFriday ? 'bg-orange-500 text-white' : day.isSaturday ? 'bg-purple-600 text-white' : 'bg-slate-900 text-white'}`}>
                                                <div>
                                                    <p className="font-black uppercase tracking-tighter text-xl">{day.dayName}</p>
                                                    <p className="text-[10px] font-bold opacity-60 uppercase">{day.date} {day.isFriday ? '• FUN NIGHT' : day.isSaturday ? '• SPECIAL' : ''}</p>
                                                </div>
                                                <Icon name={day.isFriday ? "PartyPopper" : day.isSaturday ? "Sparkles" : "ChefHat"} size={24} />
                                            </div>
                                            <div className="p-8 space-y-8 flex-1">
                                                <MealItem icon="Zap" label="Breakfast" item={day.breakfast} onEdit={() => setEditingMeal({ dayId: day.id, path: 'breakfast', pool: 'breakfast' })} yt={getYTLink(day.breakfast.name)} />
                                                
                                                <div className="h-px bg-slate-50" />
                                                
                                                <div className={`space-y-5 ${day.isSaturday ? 'bg-purple-50/50 p-4 rounded-[2rem] border border-purple-100' : ''}`}>
                                                    <h3 className={`text-[10px] font-black uppercase tracking-widest ${day.isSaturday ? 'text-purple-600' : 'text-slate-400'}`}>Lunch</h3>
                                                    <div className="grid grid-cols-1 gap-6 pl-2">
                                                        {day.lunch.isSpecial ? (
                                                            <MealItem icon="ChefHat" label="Special Saturday Meal" item={day.lunch.main} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.main', pool: 'special_meals' })} yt={getYTLink(day.lunch.main.name)} />
                                                        ) : (
                                                            <React.Fragment>
                                                                <MealItem icon="Leaf" label="Dry Sabzi (Tiffin)" item={day.lunch.veg} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.veg', pool: 'dry_veggies' })} yt={getYTLink(day.lunch.veg.name)} />
                                                                <MealItem icon="Waves" label="The Jugalbandi Dal" item={day.lunch.dal} onEdit={() => setEditingMeal({ dayId: day.id, path: 'lunch.dal', pool: 'dals' })} yt={getYTLink(day.lunch.dal.name)} sub={`Curd: ${day.curd.name}`} />
                                                            </React.Fragment>
                                                        )}
                                                    </div>
                                                    <SideItem side={day.lunchSide} flour={day.flourMix} />
                                                </div>

                                                <div className="h-px bg-slate-50" />
                                                
                                                <div className={`space-y-4 ${day.isFriday ? 'bg-orange-50 p-4 rounded-[2rem] border border-orange-100 shadow-sm' : ''}`}>
                                                    <MealItem 
                                                        icon={day.isFriday ? "Zap" : "MessageSquare"} 
                                                        label={day.isFriday ? "Friday Fun Snack (Dinner Replacement)" : "Evening Snack"} 
                                                        item={day.snack} 
                                                        onEdit={() => setEditingMeal({ dayId: day.id, path: 'snack', pool: day.isFriday ? 'special_meals' : 'snacks' })} 
                                                        yt={getYTLink(day.snack.name)} 
                                                    />
                                                    {day.isFriday && <p className="text-[10px] font-black text-orange-600 uppercase ml-14 tracking-tight">★ No separate dinner tonight</p>}
                                                </div>

                                                {day.dinner && (
                                                    <React.Fragment>
                                                        <div className="h-px bg-slate-50" />
                                                        <div className="space-y-5">
                                                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Dinner (Main)</h3>
                                                            <div className="pl-2">
                                                                <MealItem icon="Moon" label="Gravy Main" item={day.dinner.main} onEdit={() => setEditingMeal({ dayId: day.id, path: 'dinner.main', pool: 'gravy_veggies' })} yt={getYTLink(day.dinner.main.name)} />
                                                            </div>
                                                            <SideItem side={day.dinnerSide} flour={day.flourMix} />
                                                        </div>
                                                    </React.Fragment>
                                                )}
                                                
                                                <div className="mt-8 pt-6 border-t border-slate-100 bg-orange-50/50 rounded-2xl p-5 border border-orange-100">
                                                    <h4 className="text-[10px] font-black uppercase text-orange-600 tracking-widest flex items-center gap-2 mb-3">
                                                        <Icon name="Bell" size={14} /> Cook: Prep for Tomorrow | कल की तैयारी
                                                    </h4>
                                                    <div className="space-y-3">
                                                        {day.nextDayPrep && day.nextDayPrep.length > 0 ? day.nextDayPrep.map((prep, pIdx) => (
                                                            <div key={pIdx} className="flex flex-col">
                                                                <p className="text-xs font-bold text-slate-700 leading-tight">• {prep.en}</p>
                                                                <p className="text-[10px] font-bold text-orange-600 mt-0.5 ml-3 leading-tight italic">{prep.hi}</p>
                                                            </div>
                                                        )) : <p className="text-xs text-slate-400 italic">No specific prep needed.</p>}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {editingMeal && (
                        <div className="fixed inset-0 z-[1000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-6" onClick={() => setEditingMeal(null)}>
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] p-10 max-h-[80vh] flex flex-col shadow-2xl animate-fade-in" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-black mb-6 uppercase tracking-tight">Swap Item</h3>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
                                    {MASTER_REPO[editingMeal.pool].filter(i => !dislikedItems.has(i.name)).map(item => (
                                        <button key={item.name} onClick={() => updateMeal(editingMeal.dayId, editingMeal.path, item)} className="w-full text-left p-5 rounded-2xl bg-slate-50 hover:bg-blue-600 hover:text-white transition-all flex justify-between items-center group">
                                            <div>
                                                <p className="font-black text-sm">{item.name}</p>
                                                <p className="text-[10px] font-bold opacity-60 uppercase">{item.hi}</p>
                                            </div>
                                            <Icon name="ChevronRight" size={16} className="opacity-0 group-hover:opacity-100" />
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setEditingMeal(null)} className="mt-8 py-4 bg-slate-100 text-slate-400 font-black rounded-xl uppercase text-[10px]">Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MealItem = ({ icon, label, item, onEdit, yt, sub }) => (
            <div className="flex items-center justify-between group">
                <div className="flex items-start gap-4">
                    <div className="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 flex items-center justify-center shrink-0">
                        <Icon name={icon} size={20} />
                    </div>
                    <div>
                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-0.5">{label}</p>
                        <p className="font-black text-slate-800 leading-tight text-sm">{item.name}</p>
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-tight mt-0.5">{item.hi}</p>
                        {sub && <p className="text-[9px] font-bold text-blue-500 uppercase mt-1 italic leading-tight">{sub}</p>}
                    </div>
                </div>
                <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onClick={onEdit} className="w-10 h-10 rounded-lg bg-slate-100 text-slate-400 hover:text-blue-600 transition-all flex items-center justify-center no-print shadow-sm">
                        <Icon name="Edit3" size={16} />
                    </button>
                    <a href={yt} target="_blank" className="w-10 h-10 rounded-lg bg-red-50 text-red-500 hover:bg-red-500 transition-all flex items-center justify-center no-print shadow-sm">
                        <Icon name="Youtube" size={18} />
                    </a>
                </div>
            </div>
        );

        const SideItem = ({ side, flour }) => (
            <div className="flex items-center gap-4 ml-14 bg-slate-50 border border-slate-100 rounded-2xl p-4 shadow-sm relative overflow-hidden group">
                <div className="w-1 h-full bg-blue-500 absolute left-0 top-0" />
                <div className="flex flex-col flex-1">
                    <div className="flex items-baseline gap-2 mb-1">
                        <p className="font-black text-slate-800 text-sm tracking-tight uppercase leading-none">{side.en}</p>
                        <p className="text-[10px] font-bold text-slate-400 uppercase italic">/ {side.hi}</p>
                    </div>
                    {side.en === "Roti" && (
                        <div className="flex flex-col mt-1 border-t border-slate-200 pt-1">
                            <p className="text-[8px] font-black text-blue-600 uppercase tracking-widest leading-none mb-1">Seasonal Flour | आटे का मिश्रण</p>
                            <p className="text-[10px] font-black text-slate-700 leading-tight">{flour.en}</p>
                            <p className="text-[9px] font-bold text-slate-400 mt-0.5 leading-tight italic">{flour.hi}</p>
                        </div>
                    )}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
