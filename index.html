        const so = v.seasons.includes('all') || v.seasons.includes(season);
        return co && so;
    });

const buildDefaultActive = (city, season) => {

    Object.keys(VEG_MASTER).forEach(cat => {
        a[cat] = new Set(filterByCitySeason(VEG_MASTER[cat], city, season).map(v=>v.name));
    });
    return a;
};

// ══════════════════════════════════════════════════════════════════════════
//  RULE ENGINE v3 — handles all the patterns shown in the screenshot
// ══════════════════════════════════════════════════════════════════════════

// Expand day aliases: "Friday & Saturday", "Friday and Saturday",
// "Weekday", "Weekend", single day names
const expandDays = (str) => {
    const s = str.toLowerCase().trim();
    if (/weekday/.test(s))          return WEEKDAYS;                         // 1-5
    if (/weekend/.test(s))          return [0,6];                            // 0,6
    if (/everyday|all days|daily/.test(s)) return [0,1,2,3,4,5,6];
    const parts = s.split(/[&,]|\band\b/).map(p=>p.trim());
    const idxs = [];
    parts.forEach(p => {
        const i = DAY_NAMES.findIndex(d=>d.toLowerCase().startsWith(p.slice(0,3)));
        if (i>=0) idxs.push(i);
    });
    return idxs;
};

// Dal name normaliser — maps common spelling variants to master names
const normaliseDal = (raw) => {
    const r = raw.toLowerCase().trim();
    const map = {
        'arhar':'Arhar Dal', 'toor':'Arhar Dal', 'tur':'Arhar Dal',
        'moong':'Moong Dal', 'mung':'Moong Dal',
        'masoor':'Masoor Dal', 'masur':'Masoor Dal', 'lentil':'Masoor Dal',
        'chana':'Chana Dal', 'channa':'Chana Dal',
        'urad':'Urad Dal', 'urid':'Urad Dal',
        'moth':'Moth Dal', 'mote':'Moth Dal',
        'kulith':'Kulith Dal', 'horse gram':'Kulith Dal',
        'panchmel':'Panchmel Dal',
    };
    for (const k of Object.keys(map)) {
        if (r.includes(k)) return map[k];
    }
    // Try exact match in VEG_MASTER.dals
    const found = VEG_MASTER.dals.find(d=>d.name.toLowerCase().includes(r)||r.includes(d.name.toLowerCase()));
    return found ? found.name : null;
};

// ── Pattern registry ────────────────────────────────────────────────────
const RULE_PATTERNS = [
    // "Friday: No Dinner" / "Friday & Saturday: No Dinner" / "Weekday: No Dinner"
    {
        re: /^([\w\s&,]+?)\s*:\s*(no dinner|heavy snack|snacks only|no-dinner|snack only)/i,
        parse: m => ({type:'noDinner', days: expandDays(m[1])}),
        label: m => `No Dinner on: ${m[1].trim()}`,
    },
    // "Saturday: Special Lunch" / "Weekend: Special Lunch"
    {
        re: /^([\w\s&,]+?)\s*:\s*special\s*(lunch|meal|day)?/i,
        parse: m => ({type:'special', days: expandDays(m[1])}),
        label: m => `Special Meal on: ${m[1].trim()}`,
    },
    // "Weekday Lunch: Include both Arhar Dal and Moong Massor Dal"
    {
        re: /^(weekday|weekend|[\w\s&,]+?)?\s*lunch\s*:\s*include\s+both\s+([\w\s]+?)\s+(?:dal)?\s+and\s+([\w\s]+?)(?:\s+dal)?$/i,
        parse: m => {
            const d1 = normaliseDal(m[2]+' dal') || m[2].trim();
            const d2 = normaliseDal(m[3]+' dal') || m[3].trim();
            const scope = m[1] ? expandDays(m[1]) : WEEKDAYS;
            return {type:'dalPair', dal1:d1, dal2:d2, days: scope};
        },
        label: m => {
            const d1 = normaliseDal(m[2]+' dal') || m[2].trim();
            const d2 = normaliseDal(m[3]+' dal') || m[3].trim();
            return `Dal pair at Lunch: ${d1} + ${d2}`;
        },
    },
    // "Lunch: Rice on Monday Wednesday Friday"
    {
        re: /rice\s+on\s+([\w\s,]+)/i,
        parse: m => ({type:'riceOn', days: expandDays(m[1])}),
        label: m => `Rice side on: ${m[1].trim()}`,
    },
    // "Lunch: Rice 3 weekdays, Roti 2 weekdays"
    {
        re: /rice\s+(\d)\s+weekday/i,
        parse: m => ({type:'riceCount', n:parseInt(m[1])}),
        label: m => `Rice on ${m[1]} weekdays`,
    },
    {
        re: /roti\s+(\d)\s+weekday/i,
        parse: m => ({type:'rotiCount', n:parseInt(m[1])}),
        label: m => `Roti on ${m[1]} weekdays`,
    },
    // "Lunch: Side of Rice 3 weekdays and Wheat flour Roti 2 weekdays"  (screenshot case)
    {
        re: /side of rice\s+(\d)\s+weekday/i,
        parse: m => ({type:'riceCount', n:parseInt(m[1])}),
        label: m => `Rice side on ${m[1]} weekdays`,
    },
    // "Dinner Side: Should be roti made of alternate flours as per season"
    {
        re: /dinner\s+side\s*:.*alt(ernate)?\s+flour|flour.*season|season.*flour|ayurved/i,
        parse: () => ({type:'flourRotation'}),
        label: () => `Seasonal flour rotation for Dinner Roti`,
    },
    // "Lunch: Always include Dal"
    {
        re: /always\s+(?:include\s+)?dal|dal\s+daily|include\s+dal/i,
        parse: () => ({type:'alwaysDal'}),
        label: () => `Dal at every Lunch`,
    },
    // "Dinner: Must have Gravy dish"
    {
        re: /must\s+have\s+gravy|always\s+gravy|gravy\s+dinner|dinner.*gravy/i,
        parse: () => ({type:'alwaysGravy'}),
        label: () => `Gravy at every Dinner`,
    },
    // "No Dal"
    {
        re: /no\s+dal|skip\s+dal/i,
        parse: () => ({type:'noDal'}),
        label: () => `Skip Dal`,
    },
];

const SUGGESTIONS = [
    '"Friday: No Dinner"',
    '"Friday & Saturday: No Dinner"',
    '"Weekday: No Dinner"',
    '"Saturday: Special Lunch"',
    '"Weekend: Special Lunch"',
    '"Lunch: Rice on Monday Wednesday Friday"',
    '"Lunch: Rice 3 weekdays"',
    '"Lunch: Include both Arhar Dal and Masoor Dal"',
    '"Weekday Lunch: Include both Arhar Dal and Moong Dal"',
    '"Dinner: Must have Gravy dish"',
    '"Dinner Side: Alternate flours as per season"',
    '"Lunch: Always include Dal"',
];

const analyzeRule = (raw) => {
    const d = raw.trim();
    if (!d) return {status:'empty', label:'', parsed:null, suggestions:[]};
    for (const rp of RULE_PATTERNS) {
        const m = d.match(rp.re);
        if (m) return {status:'green', label:rp.label(m), parsed:rp.parse(m), suggestions:[]};
    }
    // Partial — suggest closest
    const hasDay = DAY_NAMES.some(n=>d.toLowerCase().includes(n.toLowerCase())) ||
                   /weekday|weekend/.test(d.toLowerCase());
    const hasKw  = /dinner|lunch|rice|roti|special|dal|gravy|breakfast|snack|flour|season/i.test(d);
    const relevantSuggs = SUGGESTIONS.filter(s => {
        const sl = s.toLowerCase();
        if (hasDay && /monday|tuesday|wednesday|thursday|friday|saturday|sunday|weekday|weekend/.test(sl)) return true;
        if (/dal/i.test(d) && /dal/.test(sl)) return true;
        if (/flour|season/i.test(d) && /flour/.test(sl)) return true;
        if (/rice|roti/i.test(d) && /rice|roti/.test(sl)) return true;
        return false;
    }).slice(0,3);
    return {
        status: 'yellow',
        label: 'Partially understood — refine using suggestions below',
        parsed: null,
        suggestions: relevantSuggs.length ? relevantSuggs : SUGGESTIONS.slice(0,3),
    };
};

const buildParsedRules = (directives) => {
    const rules = {
        noDinnerDays: new Set(), specialDays: new Set(), riceWeekdays: new Set(),
        alwaysDal: true, alwaysGravy: true, flourRotation: false,
        dalPairs: [],
    };
    directives.forEach(raw => {
        const {parsed: p} = analyzeRule(raw);
        if (!p) return;
        if (p.type==='noDinner')    p.days.forEach(d=>rules.noDinnerDays.add(d));
        if (p.type==='special')     p.days.forEach(d=>rules.specialDays.add(d));
        if (p.type==='riceOn')      p.days.forEach(d=>rules.riceWeekdays.add(d));
        if (p.type==='riceCount')   [1,3,5].slice(0,p.n).forEach(d=>rules.riceWeekdays.add(d));
        if (p.type==='noDal')       rules.alwaysDal = false;
        if (p.type==='flourRotation') rules.flourRotation = true;
        if (p.type==='dalPair')     rules.dalPairs.push({dal1:p.dal1, dal2:p.dal2, days:p.days});
    });
    if (rules.riceWeekdays.size===0) [1,3,5].forEach(d=>rules.riceWeekdays.add(d));
    return rules;
};

const buildPlan = (startDate, cycle, directives) => {
    const rules = buildParsedRules(directives);
    const season = getSeason();
    const flours = FLOUR_BY_SEASON[season];
    const start = new Date(startDate);
    return Array.from({length:cycle}, (_,i) => {
        const d = new Date(start); d.setDate(start.getDate()+i);
        const di = d.getDay();
        const isWeekend = di===0||di===6;
        // Dinner side: seasonal flour if flourRotation
        const dinnerSide = rules.flourRotation
            ? flours[i % flours.length].en
            : 'Roti';
        const dinnerSideHi = rules.flourRotation
            ? flours[i % flours.length].hi + ' रोटी'
            : 'रोटी';
        // Dal pair for this day
        const dalPairForDay = rules.dalPairs.find(dp=>dp.days.includes(di));
        return {
            day: DAY_NAMES[di], dayIdx: di,
            noDinner:  rules.noDinnerDays.has(di),
            isSpecial: rules.specialDays.has(di),
            side: rules.riceWeekdays.has(di)||isWeekend ? 'Rice':'Roti',
            alwaysDal: rules.alwaysDal,
            dinnerSide, dinnerSideHi,
            dalPairForDay: dalPairForDay || null,
        };
    });
};

                                                        <div className={`flex items-center px-2.5 rounded-xl border-2 ${an.status==='green'?'border-green-200 bg-green-50':an.status==='empty'?'border-slate-100 bg-slate-50':'border-amber-200 bg-amber-50'}`}>
                                                            <Icon name={an.status==='green'?'CheckCircle2':an.status==='empty'?'Minus':'AlertCircle'} size={14}
                                                                cls={an.status==='green'?'text-green-500':an.status==='empty'?'text-slate-300':'text-amber-500'}/>
                                                        </div>
                                                        <input value={d}
                                                            onChange={e=>{const n=[...tempDirs];n[i]=e.target.value;setTempDirs(n);setSaved(false);}}
                                                            placeholder='"Friday: No Dinner"  |  "Saturday: Special Lunch"  |  "Weekday Lunch: Include both Arhar Dal and Masoor Dal"'
                                                            className="flex-1 bg-slate-50 p-3.5 rounded-xl text-xs font-bold border-2 border-transparent focus:bg-white focus:border-blue-200 outline-none transition-all"/>
                                                        <button onClick={()=>{setTempDirs(tempDirs.filter((_,j)=>j!==i));setSaved(false);}}
                                                            className="p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                                                            <Icon name="Trash2" size={14}/>
                                                        </button>
                                                    </div>
                                                    {d.trim()!==''&&(
                                                        <div className={`ml-12 mt-1.5 px-3.5 py-2 rounded-xl text-[10px] font-bold flex items-start gap-2 ${an.status==='green'?'bg-green-50 text-green-700':'bg-amber-50 text-amber-700'}`}>
                                                            <Icon name={an.status==='green'?'CheckCircle2':'Lightbulb'} size={12} cls={an.status==='green'?'text-green-500 mt-px':'text-amber-500 mt-px'}/>
                                                            <div className="flex-1">
                                                                {an.status==='green'
                                                                    ?<span>Understood: <strong>{an.label}</strong></span>
                                                                    :<div>
                                                                        <span className="block mb-1.5">{an.label}</span>
                                                                        <div className="flex flex-wrap gap-1.5">
                                                                            {an.suggestions.map((s,si)=>(
                                                                                <button key={si}
                                                                                    onMouseDown={()=>{const n=[...tempDirs];n[i]=s.replace(/"/g,'');setTempDirs(n);setSaved(false);}}
                                                                                    className="bg-amber-100 hover:bg-amber-200 text-amber-800 px-2.5 py-1 rounded-lg text-[9px] font-black transition-colors cursor-pointer">
                                                                                    {s}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                }
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                        <button onClick={()=>{setTempDirs([...tempDirs,'']);setSaved(false);}}
                                            className="w-full py-3.5 border-2 border-dashed border-slate-100 rounded-2xl text-[10px] font-black uppercase text-slate-400 hover:text-blue-500 hover:border-blue-100 transition-all">
                                            + Add Rule
                                        </button>
                                    </div>

                                    <button onClick={saveRules}
                                        className={`w-full py-4 rounded-2xl font-black uppercase text-[11px] tracking-widest flex items-center justify-center gap-2 transition-all shadow-sm ${saved?'bg-green-50 text-green-600 border border-green-200':'bg-blue-600 text-white hover:bg-blue-700 shadow-lg'}`}>
                                        <Icon name={saved?'CheckCircle2':'Save'} size={15}/>
                                        {saved?'Rules Saved — Click to Re-save':'Save Rules'}
                                    </button>
                                </div>
                            )}

                            {/* ─ DISH SELECTOR TAB ─ */}
                            {planTab==='veggies'&&(
                                <div className="p-6 space-y-7">
                                    <div className="flex items-center justify-between flex-wrap gap-3">
                                        <div>
                                            <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest">
                                                Showing dishes for <span className="text-blue-600">{city}</span> in <span className="text-blue-600">{SEASON_LABEL[season]}</span>
                                            </p>
                                            <p className="text-[9px] text-slate-400 mt-0.5">✓ = selected for menu  ·  Faded = off-season  ·  + to add custom dishes</p>
                                        </div>
                                        <button onClick={()=>handleCityChange(cityInput)}
                                            className="px-4 py-2 bg-blue-50 border border-blue-100 text-blue-600 rounded-xl text-[10px] font-black uppercase tracking-wide flex items-center gap-1.5 hover:bg-blue-100 transition-all">
                                            <Icon name="RefreshCw" size={11}/>Refresh for {cityInput}
                                        </button>
                                    </div>

                                    {Object.keys(VEG_MASTER).map(cat=>{
                                        const cl=CAT_LABEL[cat];
                                        const filtered=filterByCitySeason(VEG_MASTER[cat],city,season);
                                        const allDishes=getAllDishes(cat);
                                        const sel=activeVeg[cat]||new Set();
                                        const selCount=allDishes.filter(v=>sel.has(v.name)).length;
                                        return (
                                            <div key={cat} className="space-y-3">
                                                <div className="flex items-center justify-between flex-wrap gap-2">
                                                    <div className="flex items-center gap-2">
                                                        <Icon name={cl.icon} size={13} cls="text-slate-400"/>
                                                        <p className="text-[10px] font-black uppercase text-slate-700 tracking-widest">{cl.en}</p>
                                                        <span className="text-slate-400 font-semibold text-[10px]">{cl.hi}</span>
                                                        <span className="bg-blue-100 text-blue-600 text-[9px] font-black px-2 py-0.5 rounded-full">{selCount}/{allDishes.length}</span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={()=>selectAll(cat,filtered)} className="text-[9px] font-black uppercase text-green-600 hover:underline px-2 py-1 rounded-lg hover:bg-green-50">All</button>
                                                        <button onClick={()=>deselectAll(cat)} className="text-[9px] font-black uppercase text-red-400 hover:underline px-2 py-1 rounded-lg hover:bg-red-50">None</button>
                                                    </div>
                                                </div>
                                                <div className="flex flex-wrap gap-2">
                                                    {allDishes.map(v=>{
                                                        const inSeason=filtered.some(f=>f.name===v.name)||v.custom;
                                                        const isOn=sel.has(v.name);
                                                        return (
                                                            <div key={v.name} className="relative group/chip">
                                                                <button onClick={()=>toggleVeg(cat,v.name)}
                                                                    className={`px-3 py-2 rounded-2xl text-[10px] font-bold border-2 transition-all flex flex-col items-start gap-0.5
                                                                        ${!inSeason?'opacity-30 cursor-not-allowed bg-slate-50 border-slate-100 text-slate-400'
                                                                        :isOn?'bg-blue-600 border-blue-600 text-white shadow-md'
                                                                        :'bg-white border-slate-200 text-slate-600 hover:border-blue-300 hover:bg-blue-50'}`}>
                                                                    <span>{v.name}{v.custom&&<span className="ml-1 text-[8px] opacity-60">custom</span>}</span>
                                                                    {v.hi&&<span className={`text-[9px] ${isOn?'text-blue-200':'text-slate-400'}`}>{v.hi}</span>}
                                                                    {!inSeason&&<span className="text-[8px] text-slate-400">Off-season</span>}
                                                                </button>
                                                                {v.custom&&(
                                                                    <button onClick={()=>removeCustomDish(cat,v.name)}
                                                                        className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 text-white rounded-full text-[8px] font-black hidden group-hover/chip:flex items-center justify-center leading-none">×</button>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                {/* Add custom dish */}
                                                <div className="flex gap-2 mt-1">
                                                    <input
                                                        value={newDishInputs[cat]||''}
                                                        onChange={e=>setNewDishInputs(p=>({...p,[cat]:e.target.value}))}
                                                        onKeyDown={e=>e.key==='Enter'&&addCustomDish(cat)}
                                                        placeholder={`+ Add custom ${cl.en.toLowerCase()} dish…`}
                                                        className="flex-1 bg-slate-50 px-3.5 py-2.5 rounded-xl text-[11px] font-bold border-2 border-dashed border-slate-200 focus:border-blue-300 focus:bg-white outline-none transition-all placeholder-slate-300"/>
                                                    <button onClick={()=>addCustomDish(cat)}
                                                        className="px-4 py-2 bg-slate-900 text-white rounded-xl text-[10px] font-black uppercase hover:bg-blue-600 transition-all">
                                                        Add
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        <button onClick={generateMenu}
                            className="w-full py-7 rounded-[3rem] font-black uppercase tracking-[0.2em] shadow-xl flex items-center justify-center gap-3 text-sm bg-blue-600 text-white hover:bg-blue-700 hover:scale-[1.01] active:scale-95 transition-all glow">
                            <Icon name="Sparkles" size={20}/> Generate Master Menu
                        </button>
                    </div>
                )}

                {/* ════ LIVE MENU VIEW ════ */}
                {view==='live'&&activeMenu&&(
                    <div className="space-y-10 fadein">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 no-print pt-2">
                            <div>
                                <h2 className="text-4xl font-black tracking-tighter uppercase">{activeMenu.city} Cycle</h2>
                                <p className="text-[10px] font-black text-slate-400 uppercase mt-2 tracking-widest flex items-center gap-2">
                                    <Icon name="ShieldCheck" size={12} cls="text-green-500"/>Rules Applied · {activeMenu.days.length} Days
                                </p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={()=>window.print()}
                                    className="flex items-center gap-2 bg-white border border-slate-200 px-4 py-3 rounded-2xl text-xs font-black hover:bg-slate-50 shadow-sm">
                                    <Icon name="Printer" size={15}/>Print
                                </button>
                                <button onClick={()=>setView('plan')}
                                    className="flex items-center gap-2 bg-slate-900 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-black active:scale-95 transition-all">
                                    <Icon name="ArrowLeft" size={15}/>Adjust Plan
                                </button>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {activeMenu.days.map(day=>(
                                <div key={day.id} className="bg-white rounded-[2.5rem] border border-slate-100 shadow-xl overflow-hidden flex flex-col">
                                    <div className={`px-8 py-6 flex justify-between items-center ${day.isNoDinnerDay?'bg-orange-500':day.isSpecialLunchDay?'bg-purple-600':'bg-slate-900'} text-white`}>
                                        <div>
                                            <p className="font-black uppercase tracking-tight text-xl">{day.dayName}</p>
                                            <p className="text-[10px] font-bold opacity-60 uppercase tracking-widest mt-0.5">{day.date}</p>
                                        </div>
                                        <div className="flex flex-col items-end gap-0.5">
                                            <Icon name={day.isNoDinnerDay?'Zap':day.isSpecialLunchDay?'Sparkles':'ChefHat'} size={24}/>
                                            {day.isNoDinnerDay&&<span className="text-[8px] font-black uppercase opacity-70">No Dinner</span>}
                                            {day.isSpecialLunchDay&&<span className="text-[8px] font-black uppercase opacity-70">Special</span>}
                                        </div>
                                    </div>
                                    <div className="p-8 space-y-6 flex-1">
                                        <MealItem icon="Sun" label="Breakfast · नाश्ता" item={day.breakfast}
                                            yt={getYT(day.breakfast?.name)}
                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'breakfast',pool:'breakfast'})}/>
                                        <div className="h-px bg-slate-100"/>
                                        <div className={`space-y-4 ${day.isSpecialLunchDay?'bg-purple-50 p-5 rounded-3xl border border-purple-100':''}`}>
                                            <h3 className={`text-[9px] font-black uppercase tracking-widest ${day.isSpecialLunchDay?'text-purple-600':'text-slate-400'}`}>Lunch · दोपहर का खाना</h3>
                                            <div className="space-y-4 pl-1">
                                                {day.lunch.isSpecial?(
                                                    <MealItem icon="ChefHat" label="Specialty" item={day.lunch.main}
                                                        yt={getYT(day.lunch.main?.name)}
                                                        onEdit={()=>setEditingMeal({dayId:day.id,path:'lunch.main',pool:'special_meals'})}/>
                                                ):(
                                                    <React.Fragment>
                                                        <MealItem icon="Leaf" label="Veg Dish" item={day.lunch.veg}
                                                            yt={getYT(day.lunch.veg?.name)}
                                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'lunch.veg',pool:'dry_veggies'})}/>
                                                        <MealItem icon="Waves" label="Dal" item={day.lunch.dal}
                                                            yt={getYT(day.lunch.dal?.name)}
                                                            sub={`Curd: ${day.curd?.name} · ${day.curd?.hi||''}`}
                                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'lunch.dal',pool:'dals'})}/>
                                                    </React.Fragment>
                                                )}
                                            </div>
                                            <SideItem side={day.lunchSide}/>
                                        </div>
                                        <div className="h-px bg-slate-100"/>
                                        <MealItem icon={day.isNoDinnerDay?'Star':'Coffee'}
                                            label={day.isNoDinnerDay?'Final Meal · आखिरी खाना':'Snack · शाम का नाश्ता'}
                                            item={day.snack} yt={getYT(day.snack?.name)}
                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'snack',pool:day.isNoDinnerDay?'special_meals':'snacks'})}/>
                                        {day.dinner&&(
                                            <React.Fragment>
                                                <div className="h-px bg-slate-100"/>
                                                <div className="space-y-4">
                                                    <h3 className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Dinner · रात का खाना</h3>
                                                    <div className="pl-1">
                                                        <MealItem icon="Moon" label="Main Gravy" item={day.dinner.main}
                                                            yt={getYT(day.dinner.main?.name)}
                                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'dinner.main',pool:'gravy_veggies'})}/>
                                                    </div>
                                                    <SideItem side={day.dinnerSide} sideHi={day.dinnerSideHi}/>
                                                </div>
                                            </React.Fragment>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                </div>
            </main>

            {/* Swap Modal */}
            {editingMeal&&(
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={()=>setEditingMeal(null)}>
                    <div className="bg-white w-full max-w-md rounded-3xl p-8 max-h-[80vh] flex flex-col shadow-2xl fadein" onClick={e=>e.stopPropagation()}>
                        <h3 className="text-lg font-black mb-1 uppercase tracking-tight flex items-center gap-2"><Icon name="RefreshCw" size={18}/>Swap Dish</h3>
                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-5">{CAT_LABEL[editingMeal.pool]?.en} · {CAT_LABEL[editingMeal.pool]?.hi}</p>
                        <div className="flex-1 overflow-y-auto scrollbar space-y-1.5 pr-1">
                            {getAllDishes(editingMeal.pool).map(item=>(
                                <button key={item.name} onClick={()=>updateMeal(editingMeal.dayId,editingMeal.path,item)}
                                    className="w-full text-left p-4 rounded-2xl bg-slate-50 hover:bg-blue-600 hover:text-white transition-all flex justify-between items-center group">
                                    <div>
                                        <p className="font-black text-sm">{item.name}</p>
                                        {item.hi&&<p className="text-[10px] font-bold opacity-50 mt-0.5">{item.hi}</p>}
                                    </div>
                                    <Icon name="ChevronRight" size={15} cls="opacity-0 group-hover:opacity-100"/>
                                </button>
                            ))}
                        </div>
                        <button onClick={()=>setEditingMeal(null)}
                            className="mt-5 py-4 bg-slate-100 text-slate-500 font-black rounded-2xl uppercase text-[10px] tracking-widest hover:bg-slate-200 transition-all">
                            Close
                        </button>
                    </div>
                </div>
            )}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
