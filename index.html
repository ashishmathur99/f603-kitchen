    if (m >= 12 || m <= 2) return 'winter';
    if (m >= 3  && m <= 5) return 'summer';
    if (m >= 6  && m <= 9) return 'monsoon';
    return 'autumn';
};

        return cityOk && seasonOk;
    });

};

// ── Rule Engine ────────────────────────────────────────────────────────────
const RULE_PATTERNS = [
    { pattern: /^(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\s*:\s*(no dinner|heavy snack|snacks only)/i,
      parse: (m) => ({ type:'noDinner', day: DAY_NAMES.findIndex(d=>d.toLowerCase()===m[1].toLowerCase()) }),
      label: (m) => `${m[1]}: No Dinner` },
    { pattern: /^(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\s*:\s*special/i,
      parse: (m) => ({ type:'special', day: DAY_NAMES.findIndex(d=>d.toLowerCase()===m[1].toLowerCase()) }),
      label: (m) => `${m[1]}: Special Lunch` },
    { pattern: /rice\s+on\s+([\w\s,]+)/i,
      parse: (m) => ({ type:'riceOn', days: m[1].split(/[\s,]+/).map(w=>DAY_NAMES.findIndex(d=>d.toLowerCase().startsWith(w.toLowerCase().slice(0,3)))).filter(i=>i>=0) }),
      label: (m) => `Rice on: ${m[1].trim()}` },
    { pattern: /rice\s+(\d)\s+weekday/i,
      parse: (m) => ({ type:'riceCount', n: parseInt(m[1]) }),
      label: (m) => `Rice ${m[1]} weekdays` },
    { pattern: /roti\s+(\d)\s+weekday/i,
      parse: (m) => ({ type:'rotiCount', n: parseInt(m[1]) }),
      label: (m) => `Roti ${m[1]} weekdays` },
    { pattern: /always\s+dal|include\s+dal|dal\s+daily/i,
      parse: () => ({ type:'alwaysDal' }),
      label: () => 'Dal at every Lunch' },
    { pattern: /always\s+gravy|gravy\s+dinner|dinner.*gravy/i,
      parse: () => ({ type:'alwaysGravy' }),
      label: () => 'Gravy at every Dinner' },
    { pattern: /no\s+dal|skip\s+dal/i,
      parse: () => ({ type:'noDal' }),
      label: () => 'No Dal at Lunch' },
    { pattern: /no\s+dinner/i,
      parse: () => ({ type:'noDal' }), // generic
      label: () => 'No Dinner (all days)' },
];

const RULE_SUGGESTIONS = [
    '"Monday: No Dinner"',
    '"Saturday: Special Lunch"',
    '"Lunch: Rice on Monday Wednesday Friday"',
    '"Lunch: Rice 3 weekdays"',
    '"Lunch: Always include Dal"',
    '"Dinner: Always Gravy dish"',
];

const analyzeRule = (raw) => {
    const d = raw.trim();
    if (!d) return { status:'empty', label:'', parsed:null };
    for (const rp of RULE_PATTERNS) {
        const m = d.match(rp.pattern);
        if (m) return { status:'green', label: rp.label(m), parsed: rp.parse(m) };
    }
    // Partial matches
    const hasDay = DAY_NAMES.some(n => d.toLowerCase().includes(n.toLowerCase()));
    const hasKeyword = /dinner|lunch|rice|roti|special|dal|gravy|breakfast|snack/i.test(d);
    if (hasDay || hasKeyword) {
        return { status:'yellow', label:'Partially understood — see suggestion below', parsed:null };
    }
    return { status:'yellow', label:'Not recognized — try a different format', parsed:null };
};

const parseAllRules = (directives) => {
    const rules = { noDinnerDays:new Set(), specialDays:new Set(), riceWeekdays:new Set(), alwaysDal:true, alwaysGravy:true };
    directives.forEach(raw => {
        const res = analyzeRule(raw);
        if (!res.parsed) return;
        const p = res.parsed;
        if (p.type === 'noDinner')   rules.noDinnerDays.add(p.day);
        if (p.type === 'special')    rules.specialDays.add(p.day);
        if (p.type === 'riceOn')     p.days.forEach(i => rules.riceWeekdays.add(i));
        if (p.type === 'riceCount')  [1,3,5].slice(0,p.n).forEach(i=>rules.riceWeekdays.add(i));
        if (p.type === 'noDal')      rules.alwaysDal = false;
    });
    if (rules.riceWeekdays.size === 0) [1,3,5].forEach(i=>rules.riceWeekdays.add(i));
    return rules;
};

const buildPlan = (startDate, cycle, directives) => {
    const rules = parseAllRules(directives);
    const start = new Date(startDate);
    return Array.from({ length: cycle }, (_,i) => {
        const d = new Date(start); d.setDate(start.getDate()+i);
        const di = d.getDay();
        const isWeekend = di===0||di===6;
        return {
            day: DAY_NAMES[di], dayIdx: di,
            noDinner:  rules.noDinnerDays.has(di),
            isSpecial: rules.specialDays.has(di),
            side: rules.riceWeekdays.has(di)||isWeekend ? 'Rice':'Roti',
            alwaysDal: rules.alwaysDal,
        };
    });
};

// ── Icon helper ────────────────────────────────────────────────────────────
const Icon = ({ name, size=18, cls='' }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (!window.lucide||!ref.current) return;
        const k = name.replace(/([a-z])([A-Z])/g,'$1-$2').toLowerCase();
        ref.current.innerHTML = `<i data-lucide="${k}"></i>`;
        window.lucide.createIcons({ root:ref.current, attrs:{width:size,height:size,'stroke-width':2.2,class:cls}, nameAttr:'data-lucide' });
    },[name,size,cls]);
    return <span ref={ref} className="inline-flex items-center justify-center flex-shrink-0" />;
};

    useEffect(() => {
        try {
            const h = localStorage.getItem('t360_history'); if(h) setHistory(JSON.parse(h));
            const v = localStorage.getItem('t360_veg');     if(v) {
                const parsed = JSON.parse(v);
                const restored = {};
                Object.keys(parsed).forEach(k => restored[k] = new Set(parsed[k]));
                setActiveVeg(restored);
            }
        } catch(e) {}
        setIsSyncing(false);
    }, []);

    // Persist
    useEffect(() => {
        if (isSyncing) return;
        localStorage.setItem('t360_history', JSON.stringify(history));
        const vegSerial = {};
        Object.keys(activeVeg).forEach(k => vegSerial[k]=[...activeVeg[k]]);
        localStorage.setItem('t360_veg', JSON.stringify(vegSerial));
    }, [history, activeVeg, isSyncing]);

    // When city changes, re-filter veggies (keep previously selected if still valid)
    const handleCityChange = (newCity) => {
        setCity(newCity);
        setCityInput(newCity);
        setShowCitySuggest(false);
        // Reset active veg to city+season defaults
        setActiveVeg(buildDefaultActive(newCity, season));
    };

    const citySuggestions = KNOWN_CITIES.filter(c =>
        c.toLowerCase().startsWith(cityInput.toLowerCase()) && c.toLowerCase() !== cityInput.toLowerCase()
    );

    // Toggle a vegetable on/off
    const toggleVeg = (cat, name) => {
        setActiveVeg(prev => {
            const updated = { ...prev, [cat]: new Set(prev[cat]) };
            if (updated[cat].has(name)) updated[cat].delete(name);
            else updated[cat].add(name);
            return updated;
        });
    };

    const selectAllInCat = (cat, filteredItems) => {
        setActiveVeg(prev => ({ ...prev, [cat]: new Set(filteredItems.map(v=>v.name)) }));
    };

    const deselectAllInCat = (cat) => {
        setActiveVeg(prev => ({ ...prev, [cat]: new Set() }));
    };

    // Save rules
    const saveRules = () => {
        const final = tempDirs.filter(d=>d.trim()!=='');
        setDirectives(final);
        localStorage.setItem('t360_dirs', JSON.stringify(final));
        setDirsSaved(true);
    };

    // Generate
    const generateMenu = () => {
        setError(null);
        try {
            const logicPlan = buildPlan(startDate, cycle, directives);
            const start = new Date(startDate);

            // Build pools from active selections
            const pool = (cat) => {
                const items = (activeVeg[cat]||new Set());
                const list = VEG_MASTER[cat].filter(v=>items.has(v.name));
                if (list.length === 0) return VEG_MASTER[cat]; // fallback
                return list;
            };

            const nb    = makeRotator(pool('breakfast'));
            const nd    = makeRotator(pool('dry_veggies'));
            const ng    = makeRotator(pool('gravy_veggies'));
            const ndal  = makeRotator(pool('dals'));
            const ns    = makeRotator(pool('special_meals'));
            const nsnack= makeRotator(pool('snacks'));
            const nc    = makeRotator(pool('curd'));

            const days = logicPlan.map((plan, i) => {
                const d = new Date(start); d.setDate(start.getDate()+i);
                return {
                    id: i,
                    date: d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),
                    dayName: plan.day,
                    isNoDinnerDay: plan.noDinner,
                    isSpecialLunchDay: plan.isSpecial,
                    lunchSide: plan.side,
                    breakfast: nb(),
                    lunch: plan.isSpecial
                        ? { isSpecial:true, main:ns() }
                        : { isSpecial:false, veg:nd(), dal:ndal() },
                    snack: plan.noDinner ? ns() : nsnack(),
                    dinner: plan.noDinner ? null : { main:ng() },
                    curd: nc(),
                };
            });

            const menuObj = { id:Date.now(), timestamp:new Date().toLocaleString(), city, days };
            setHistory(prev=>[menuObj,...prev].slice(0,10));
            setActiveMenu(menuObj);
            setView('live');
        } catch(err) { setError(err.message); }
    };

    const updateMeal = (dayId, path, item) => {
        const updated = JSON.parse(JSON.stringify(activeMenu));
        const day = updated.days.find(d=>d.id===dayId);
        const keys = path.split('.');
        if (keys.length===1) day[keys[0]]=item;
        else day[keys[0]][keys[1]]=item;
        setActiveMenu(updated);
        setEditingMeal(null);
    };

    if (isSyncing) return <div className="h-screen flex items-center justify-center font-black uppercase tracking-widest text-slate-300">Loading…</div>;

    return (
        <div className="min-h-screen flex flex-col lg:flex-row">
            {/* ── Sidebar History ── */}
            <aside className="w-full lg:w-64 bg-white border-r border-slate-200 no-print flex-shrink-0">
                <div className="p-5 border-b border-slate-100 flex items-center gap-3">
                    <div className="bg-blue-600 p-2 rounded-xl text-white"><Icon name="ChefHat" size={16}/></div>
                    <div>
                        <p className="font-black text-[10px] uppercase tracking-wider">History</p>
                        <p className="text-[9px] text-slate-400">{history.length} cycles saved</p>
                    </div>
                </div>
                <div className="p-3 space-y-1.5 overflow-y-auto max-h-[30vh] lg:max-h-[calc(100vh-80px)]">
                    {history.length===0 && <p className="text-[10px] text-slate-300 font-bold text-center py-8">No history yet</p>}
                    {history.map(h=>(
                        <button key={h.id} onClick={()=>{setActiveMenu(h);setView('live');}}
                            className={`w-full text-left p-3 rounded-xl border transition-all ${activeMenu?.id===h.id?'bg-blue-50 border-blue-200':'bg-white hover:border-slate-200 border-transparent'}`}>
                            <p className="text-[9px] font-black text-blue-600 uppercase">{h.city}</p>
                            <p className="text-[10px] font-bold text-slate-600 mt-0.5">{h.timestamp.split(',')[0]}</p>
                        </button>
                    ))}
                </div>
            </aside>

            {/* ── Main ── */}
            <main className="flex-1 p-4 lg:p-10 w-full overflow-x-hidden">
                <div className="max-w-5xl mx-auto">

                {/* ════════════════ PLAN VIEW ════════════════ */}
                {view==='plan' && (
                    <div className="space-y-8 fade-in">
                        <header className="text-center pt-4">
                            <h1 className="text-4xl lg:text-5xl font-black text-slate-900 tracking-tighter">The360 Kitchen</h1>
                            <div className="flex items-center justify-center gap-2 mt-2">
                                <Icon name={SEASON_ICON[season]} size={14} cls="text-blue-400"/>
                                <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">{SEASON_LABEL[season]} · Local Engine · No API</p>
                            </div>
                        </header>

                        {error && (
                            <div className="bg-red-50 border border-red-200 text-red-600 p-4 rounded-2xl text-xs font-bold flex items-center gap-3 shake">
                                <Icon name="AlertTriangle" size={16}/><span>{error}</span>
                            </div>
                        )}

                        {/* Config Row */}
                        <div className="grid sm:grid-cols-3 gap-4 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                            {/* City with autocomplete */}
                            <div className="space-y-1.5 relative">
                                <label className="text-[9px] font-black uppercase text-slate-400 ml-1 tracking-widest">City</label>
                                <input value={cityInput}
                                    onChange={e=>{setCityInput(e.target.value);setShowCitySuggest(true);}}
                                    onBlur={()=>setTimeout(()=>setShowCitySuggest(false),150)}
                                    onFocus={()=>setShowCitySuggest(true)}
                                    className="w-full bg-slate-50 p-3.5 rounded-2xl font-bold text-sm outline-none border-2 border-transparent focus:border-blue-400 transition-all"/>
                                {showCitySuggest && citySuggestions.length>0 && (
                                    <div className="absolute top-full left-0 right-0 z-50 bg-white border border-slate-200 rounded-2xl shadow-xl mt-1 overflow-hidden">
                                        {citySuggestions.slice(0,5).map(c=>(
                                            <button key={c} onMouseDown={()=>handleCityChange(c)}
                                                className="w-full text-left px-4 py-3 text-sm font-bold hover:bg-blue-50 transition-colors border-b border-slate-50 last:border-0">
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-[9px] font-black uppercase text-slate-400 ml-1 tracking-widest">Start Date</label>
                                <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}
                                    className="w-full bg-slate-50 p-3.5 rounded-2xl font-bold text-sm outline-none border-2 border-transparent focus:border-blue-400 transition-all"/>
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-[9px] font-black uppercase text-slate-400 ml-1 tracking-widest">Cycle (Days)</label>
                                <div className="flex bg-slate-50 p-1 rounded-2xl">
                                    {[3,7,14].map(n=>(
                                        <button key={n} onClick={()=>setCycle(n)}
                                            className={`flex-1 py-2.5 rounded-xl text-xs font-black transition-all ${cycle===n?'bg-white shadow text-blue-600':'text-slate-400 hover:text-slate-600'}`}>{n}</button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Tabs */}
                        <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
                            <div className="flex border-b border-slate-100">
                                {[
                                    {id:'rules',   label:'House Rules',        icon:'Settings2'},
                                    {id:'veggies', label:'Vegetable Selector', icon:'Salad'},
                                ].map(t=>(
                                    <button key={t.id} onClick={()=>setPlanTab(t.id)}
                                        className={`flex-1 flex items-center justify-center gap-2 py-4 text-[10px] font-black uppercase tracking-widest transition-all ${planTab===t.id?'tab-active bg-blue-50/30':'text-slate-400 hover:text-slate-600'}`}>
                                        <Icon name={t.icon} size={13}/>{t.label}
                                    </button>
                                ))}
                            </div>

                            {/* ── RULES TAB ── */}
                            {planTab==='rules' && (
                                <div className="p-6 space-y-5">
                                    <div className="flex items-center justify-between">
                                        <p className="text-[9px] font-black uppercase text-slate-400 tracking-widest">
                                            Write rules in plain English — engine parses them automatically
                                        </p>
                                        <span className={`text-[9px] font-black uppercase px-3 py-1 rounded-full ${dirsSaved?'bg-green-100 text-green-600':'bg-amber-100 text-amber-600'}`}>
                                            {dirsSaved?'✓ Saved':'● Unsaved'}
                                        </span>
                                    </div>
                                    <div className="space-y-2">
                                        {tempDirs.map((d,i)=>{
                                            const analysis = analyzeRule(d);
                                            return (
                                                <div key={i} className="space-y-1 fade-in">
                                                    <div className="flex gap-2 group">
                                                        <div className={`flex items-center px-2 rounded-xl border ${analysis.status==='green'?'border-green-200 bg-green-50':'analysis.status==="empty"'?'border-slate-100 bg-slate-50':'border-amber-200 bg-amber-50'}`}>
                                                            <Icon name={analysis.status==='green'?'CheckCircle2':analysis.status==='empty'?'Minus':'AlertCircle'} size={13}
                                                                cls={analysis.status==='green'?'text-green-500':analysis.status==='empty'?'text-slate-300':'text-amber-500'}/>
                                                        </div>
                                                        <input value={d}
                                                            onChange={e=>{const n=[...tempDirs];n[i]=e.target.value;setTempDirs(n);setDirsSaved(false);}}
                                                            placeholder='e.g. "Friday: No Dinner" · "Saturday: Special Lunch"'
                                                            className="flex-1 bg-slate-50 p-3.5 rounded-xl text-xs font-bold border-2 border-transparent focus:bg-white focus:border-blue-200 outline-none transition-all"/>
                                                        <button onClick={()=>{setTempDirs(tempDirs.filter((_,idx)=>idx!==i));setDirsSaved(false);}}
                                                            className="p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                                                            <Icon name="Trash2" size={14}/>
                                                        </button>
                                                    </div>
                                                    {/* Understanding feedback */}
                                                    {d.trim()!=='' && (
                                                        <div className={`ml-10 px-3 py-1.5 rounded-lg text-[10px] font-bold flex items-start gap-2 ${analysis.status==='green'?'bg-green-50 text-green-700':'bg-amber-50 text-amber-700'}`}>
                                                            <Icon name={analysis.status==='green'?'CheckCircle2':'Lightbulb'} size={11}
                                                                cls={analysis.status==='green'?'text-green-500 mt-0.5':'text-amber-500 mt-0.5'}/>
                                                            <div>
                                                                {analysis.status==='green'
                                                                    ? <span>Understood: <strong>{analysis.label}</strong></span>
                                                                    : <span>
                                                                        Not fully understood. Try: {RULE_SUGGESTIONS.slice(0,3).map((s,si)=>(
                                                                            <button key={si} onMouseDown={()=>{const n=[...tempDirs];n[i]=s.replace(/"/g,'');setTempDirs(n);setDirsSaved(false);}}
                                                                                className="underline decoration-dotted mx-1 hover:text-amber-900 cursor-pointer">
                                                                                {s}
                                                                            </button>
                                                                        ))}
                                                                    </span>
                                                                }
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                        <button onClick={()=>{setTempDirs([...tempDirs,'']);setDirsSaved(false);}}
                                            className="w-full py-3.5 border-2 border-dashed border-slate-100 rounded-2xl text-[10px] font-black uppercase text-slate-400 hover:text-blue-500 hover:border-blue-100 transition-all">
                                            + Add Rule
                                        </button>
                                    </div>
                                    <button onClick={saveRules}
                                        className={`w-full py-4 rounded-2xl font-black uppercase text-[11px] tracking-widest flex items-center justify-center gap-2 transition-all ${dirsSaved?'bg-green-50 text-green-600 border border-green-200':'bg-blue-600 text-white hover:bg-blue-700 shadow-lg'}`}>
                                        <Icon name={dirsSaved?'CheckCircle2':'Save'} size={15}/>
                                        {dirsSaved?'Rules Saved':'Save Rules'}
                                    </button>
                                </div>
                            )}

                            {/* ── VEGGIE SELECTOR TAB ── */}
                            {planTab==='veggies' && (
                                <div className="p-6 space-y-6">
                                    <div className="flex items-center justify-between flex-wrap gap-3">
                                        <div>
                                            <p className="text-[10px] font-black uppercase text-slate-500 tracking-widest">
                                                Showing vegetables for <span className="text-blue-600">{city || cityInput}</span> in <span className="text-blue-600">{SEASON_LABEL[season]}</span>
                                            </p>
                                            <p className="text-[9px] text-slate-400 mt-0.5">Tick what you want included in your meal plan</p>
                                        </div>
                                        <button onClick={()=>handleCityChange(cityInput)}
                                            className="px-4 py-2 bg-blue-50 border border-blue-100 text-blue-600 rounded-xl text-[10px] font-black uppercase tracking-wide flex items-center gap-1.5 hover:bg-blue-100 transition-all">
                                            <Icon name="RefreshCw" size={11}/>Refresh for {cityInput}
                                        </button>
                                    </div>

                                    {['breakfast','dry_veggies','gravy_veggies','dals','snacks','special_meals','curd'].map(cat=>{
                                        const catLabel = CATEGORY_LABELS[cat];
                                        const filtered = filterByCitySeason(VEG_MASTER[cat], city||cityInput, season);
                                        const allItems = VEG_MASTER[cat]; // show all, mark unavailable
                                        const selected = activeVeg[cat]||new Set();
                                        const selectedCount = filtered.filter(v=>selected.has(v.name)).length;
                                        return (
                                            <div key={cat} className="space-y-2">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-2">
                                                        <Icon name={catLabel.icon} size={13} cls="text-slate-400"/>
                                                        <p className="text-[10px] font-black uppercase text-slate-600 tracking-widest">{catLabel.en}</p>
                                                        <span className="text-[9px] text-slate-400 font-bold">{catLabel.hi}</span>
                                                        <span className="bg-blue-100 text-blue-600 text-[9px] font-black px-2 py-0.5 rounded-full">{selectedCount}/{filtered.length}</span>
                                                    </div>
                                                    <div className="flex gap-1.5">
                                                        <button onClick={()=>selectAllInCat(cat,filtered)}
                                                            className="text-[9px] font-black uppercase text-green-600 hover:underline">All</button>
                                                        <span className="text-slate-300">·</span>
                                                        <button onClick={()=>deselectAllInCat(cat)}
                                                            className="text-[9px] font-black uppercase text-red-400 hover:underline">None</button>
                                                    </div>
                                                </div>
                                                <div className="flex flex-wrap gap-2">
                                                    {allItems.map(v=>{
                                                        const inSeason = filtered.some(f=>f.name===v.name);
                                                        const isOn = selected.has(v.name);
                                                        return (
                                                            <button key={v.name} onClick={()=>inSeason && toggleVeg(cat,v.name)}
                                                                className={`px-3 py-2 rounded-2xl text-[10px] font-bold border-2 transition-all flex flex-col items-start gap-0.5
                                                                    ${!inSeason ? 'opacity-30 cursor-not-allowed bg-slate-50 border-slate-100 text-slate-400'
                                                                    : isOn ? 'bg-blue-600 border-blue-600 text-white shadow-md'
                                                                    : 'bg-white border-slate-200 text-slate-600 hover:border-blue-300 hover:bg-blue-50'}`}>
                                                                <span>{v.name}</span>
                                                                <span className={`text-[9px] ${isOn?'text-blue-200':'text-slate-400'}`}>{v.hi}</span>
                                                                {!inSeason && <span className="text-[8px] text-slate-400">Off-season</span>}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        <button onClick={generateMenu}
                            className="w-full py-7 rounded-[3rem] font-black uppercase tracking-[0.2em] shadow-xl flex items-center justify-center gap-3 text-sm bg-blue-600 text-white hover:bg-blue-700 hover:scale-[1.01] active:scale-95 transition-all glow">
                            <Icon name="Sparkles" size={20}/> Generate Master Menu
                        </button>
                    </div>
                )}

                {/* ════════════════ LIVE MENU VIEW ════════════════ */}
                {view==='live' && activeMenu && (
                    <div className="space-y-10 fade-in">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 no-print pt-2">
                            <div>
                                <h2 className="text-4xl font-black tracking-tighter uppercase">{activeMenu.city} Cycle</h2>
                                <p className="text-[10px] font-black text-slate-400 uppercase mt-2 tracking-widest flex items-center gap-2">
                                    <Icon name="ShieldCheck" size={12} cls="text-green-500"/>Rules Applied · {activeMenu.days.length} Days
                                </p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={()=>window.print()}
                                    className="flex items-center gap-2 bg-white border border-slate-200 px-4 py-3 rounded-2xl text-xs font-black hover:bg-slate-50 shadow-sm transition-all">
                                    <Icon name="Printer" size={15}/>Print
                                </button>
                                <button onClick={()=>setView('plan')}
                                    className="flex items-center gap-2 bg-slate-900 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-black active:scale-95 transition-all">
                                    <Icon name="ArrowLeft" size={15}/>Adjust Plan
                                </button>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {activeMenu.days.map(day=>(
                                <div key={day.id} className="bg-white rounded-[2.5rem] border border-slate-100 shadow-xl overflow-hidden flex flex-col">
                                    {/* Day Header */}
                                    <div className={`px-8 py-6 flex justify-between items-center ${day.isNoDinnerDay?'bg-orange-500':day.isSpecialLunchDay?'bg-purple-600':'bg-slate-900'} text-white`}>
                                        <div>
                                            <p className="font-black uppercase tracking-tight text-xl">{day.dayName}</p>
                                            <p className="text-[10px] font-bold opacity-60 uppercase tracking-widest mt-0.5">{day.date}</p>
                                        </div>
                                        <div className="flex flex-col items-end gap-1">
                                            <Icon name={day.isNoDinnerDay?'Zap':day.isSpecialLunchDay?'Sparkles':'ChefHat'} size={24}/>
                                            {day.isNoDinnerDay   && <span className="text-[8px] font-black uppercase opacity-70">No Dinner</span>}
                                            {day.isSpecialLunchDay && <span className="text-[8px] font-black uppercase opacity-70">Special</span>}
                                        </div>
                                    </div>

                                    <div className="p-8 space-y-6 flex-1">
                                        {/* Breakfast */}
                                        <MealItem icon="Sun" label="Breakfast · नाश्ता" item={day.breakfast}
                                            yt={getYT(day.breakfast?.name)}
                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'breakfast',pool:'breakfast'})}/>

                                        <div className="h-px bg-slate-100"/>

                                        {/* Lunch */}
                                        <div className={`space-y-4 ${day.isSpecialLunchDay?'bg-purple-50 p-5 rounded-3xl border border-purple-100':''}`}>
                                            <h3 className={`text-[9px] font-black uppercase tracking-widest ${day.isSpecialLunchDay?'text-purple-600':'text-slate-400'}`}>
                                                Lunch · दोपहर का खाना
                                            </h3>
                                            <div className="space-y-4 pl-1">
                                                {day.lunch.isSpecial ? (
                                                    <MealItem icon="ChefHat" label="Specialty" item={day.lunch.main}
                                                        yt={getYT(day.lunch.main?.name)}
                                                        onEdit={()=>setEditingMeal({dayId:day.id,path:'lunch.main',pool:'special_meals'})}/>
                                                ) : (
                                                    <React.Fragment>
                                                        <MealItem icon="Leaf" label="Veg Dish" item={day.lunch.veg}
                                                            yt={getYT(day.lunch.veg?.name)}
                                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'lunch.veg',pool:'dry_veggies'})}/>
                                                        <MealItem icon="Waves" label="Dal" item={day.lunch.dal}
                                                            yt={getYT(day.lunch.dal?.name)}
                                                            sub={`Curd: ${day.curd?.name} · ${day.curd?.hi}`}
                                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'lunch.dal',pool:'dals'})}/>
                                                    </React.Fragment>
                                                )}
                                            </div>
                                            <SideItem side={day.lunchSide}/>
                                        </div>

                                        <div className="h-px bg-slate-100"/>

                                        {/* Snack */}
                                        <MealItem icon={day.isNoDinnerDay?'Star':'Coffee'}
                                            label={day.isNoDinnerDay?'Final Meal · आखिरी खाना':'Snack · नाश्ता'}
                                            item={day.snack} yt={getYT(day.snack?.name)}
                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'snack',pool:day.isNoDinnerDay?'special_meals':'snacks'})}/>

                                        {/* Dinner */}
                                        {day.dinner && (
                                            <React.Fragment>
                                                <div className="h-px bg-slate-100"/>
                                                <div className="space-y-4">
                                                    <h3 className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Dinner · रात का खाना</h3>
                                                    <div className="pl-1">
                                                        <MealItem icon="Moon" label="Main Gravy" item={day.dinner.main}
                                                            yt={getYT(day.dinner.main?.name)}
                                                            onEdit={()=>setEditingMeal({dayId:day.id,path:'dinner.main',pool:'gravy_veggies'})}/>
                                                    </div>
                                                    <SideItem side="Roti"/>
                                                </div>
                                            </React.Fragment>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
                </div>
            </main>

            {/* ── Swap Modal ── */}
            {editingMeal && (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={()=>setEditingMeal(null)}>
                    <div className="bg-white w-full max-w-md rounded-3xl p-8 max-h-[80vh] flex flex-col shadow-2xl fade-in" onClick={e=>e.stopPropagation()}>
                        <h3 className="text-lg font-black mb-1 uppercase tracking-tight flex items-center gap-2">
                            <Icon name="RefreshCw" size={18}/> Swap Dish
                        </h3>
                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-5">
                            {CATEGORY_LABELS[editingMeal.pool]?.en} · {CATEGORY_LABELS[editingMeal.pool]?.hi}
                        </p>
                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                            {(VEG_MASTER[editingMeal.pool]||[]).map(item=>(
                                <button key={item.name} onClick={()=>updateMeal(editingMeal.dayId,editingMeal.path,item)}
                                    className="w-full text-left p-4 rounded-2xl bg-slate-50 hover:bg-blue-600 hover:text-white transition-all flex justify-between items-center group">
                                    <div>
                                        <p className="font-black text-sm">{item.name}</p>
                                        <p className="text-[10px] font-bold opacity-50 mt-0.5">{item.hi}</p>
                                    </div>
                                    <Icon name="ChevronRight" size={15} cls="opacity-0 group-hover:opacity-100"/>
                                </button>
                            ))}
                        </div>
                        <button onClick={()=>setEditingMeal(null)}
                            className="mt-5 py-4 bg-slate-100 text-slate-500 font-black rounded-2xl uppercase text-[10px] tracking-widest hover:bg-slate-200 transition-all">
                            Close
                        </button>
                    </div>
                </div>
            )}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
