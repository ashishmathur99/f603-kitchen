        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                const render = () => {
                    if (window.lucide && iconRef.current) {
                        const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                        iconRef.current.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                        window.lucide.createIcons({
                            attrs: { width: size, height: size, 'stroke-width': 2.5, class: className }
                        });
                    }
                };
                render();
                const timer = setTimeout(render, 500);
                return () => clearTimeout(timer);
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

                const c = cityInput.toLowerCase();

                if (c.includes('delhi') || c.includes('noida') || c.includes('gurgaon') || c.includes('jaipur')) {
                    if (month >= 10 || month <= 2) return "winter"; 
                    if (month >= 3 && month <= 5) return "summer";
                    return "monsoon";
                }
                if (month >= 10 || month <= 1) return "winter";
                if (month >= 2 && month <= 5) return "summer";
                if (month >= 6 && month <= 8) return "monsoon";
                return "spring";
            };

                const pools = inventory.reduce((acc, cat) => {
                    acc[cat.id] = [...cat.items.filter(i => i.selected)].sort(() => Math.random() - 0.5);
                    return acc;
                }, {});

                const getNext = (id, index, filterFn = null) => {
                    let p = pools[id];
                    if (filterFn) {
                        p = p.filter(filterFn);
                        if (p.length === 0) p = pools[id];

                    if (!p || p.length === 0) return { name: "N/A", hi: "N/A", yt: "#" };
                    return p[index % p.length];

                const season = getCurrentSeason(city);
                const currentFlour = AYURVEDA_FLOURS[season];
                const riceIndices = Array.from({ length: days }).map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 3);

                const start = new Date(startDate);

                    const isWeekendMerge = (dayOfWeek === 5 || dayOfWeek === 6);
                    
                    const isDinnerGravy = Math.random() > 0.4; 

                    let dinnerMain, dinnerDal;

                    if (isDinnerGravy) {
                        const useProteinAsMain = Math.random() > 0.5;
                        if (useProteinAsMain) {
                             dinnerMain = getNext('proteins', i + 5, item => item.style === 'gravy' || item.style === 'both');

                             dinnerMain = getNext('veggies', i + 5, item => item.style === 'gravy' || item.style === 'both');
                        }
                        dinnerDal = null;
                    } else {
                        dinnerMain = getNext('veggies', i + 5, item => item.style === 'dry' || item.style === 'both');

                        day: i + 1,
                        date: currentDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
                        weekDay: currentDate.toLocaleDateString('en-US', { weekday: 'long' }),
                        isAshishEgg: [1, 3, 5].includes(dayOfWeek),
                        isWeekendMerge,
                        flour: currentFlour,
                        side: riceIndices.includes(i) ? { en: "Rice", hi: "चावल" } : { en: "Roti", hi: "रोटी" },
                        breakfast: getNext('breakfast', i),
                        curd: getNext('curd', i),
                        lunch: { veg: getNext('veggies', i), prot: getNext('proteins', i) },
                        snack: getNext('snacks', i),
                        weekendSnack: getNext('weekend', i),
                        dinner: { 
                            main: dinnerMain,
                            isGravy: isDinnerGravy,
                            dal: dinnerDal

                setView('live');

                                </div>
                                <button onClick={() => setEditingMeal(null)} className="mt-8 w-full py-5 rounded-3xl bg-slate-100 text-slate-400 font-black tracking-widest uppercase text-xs">Cancel</button>
                            </div>
                        </div>
                    )}

                    <footer className="fixed bottom-0 left-0 right-0 p-8 bg-white/90 backdrop-blur-2xl border-t border-slate-100 z-50 flex justify-center gap-6 shadow-2xl">
                        {view === 'plan' ? (
                            <button onClick={deployMenu} className="w-full max-w-lg bg-blue-600 hover:bg-blue-700 text-white font-black py-5 px-10 rounded-[2.5rem] shadow-2xl shadow-blue-200 flex items-center justify-center gap-4 transition-all active:scale-95 group animate-[pulse_3s_infinite]">
                                <Icon name="Zap" size={24} className="group-hover:animate-pulse" /> DEPLOY MASTER CYCLE
                            </button>
                        ) : (
                            <React.Fragment>
                                <button onClick={() => {
                                    let text = `*INDIAN VEG MENU / भारतीय शाकाहारी मेनू*\n${city} • ${startDate}\n--------------------------\n`;
                                    masterMenu.forEach(d => {
                                        text += `\n*${d.weekDay}* (Day ${d.day})\n`;
                                        text += `🌅 Brk/नाश्ता: ${d.breakfast.name} (${d.breakfast.hi})\n`;
                                        text += `☀️ Lun/दोपहर: ${d.lunch.veg.name} (${d.lunch.veg.hi}) + ${d.lunch.prot.name} (${d.lunch.prot.hi})\n`;
                                        text += `   Side: ${d.side.en} / ${d.side.hi}\n`;
                                        if (d.isWeekendMerge) {
                                            text += `🎉 Special: ${d.weekendSnack.name} (${d.weekendSnack.hi})\n`;
                                        } else {
                                            text += `🌙 Din/रात: ${d.dinner.main.name} (${d.dinner.main.hi})\n`;
                                        }
                                    });
                                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
                                }} className="flex-1 max-w-sm bg-green-500 hover:bg-green-600 text-white font-black py-5 px-8 rounded-[2rem] flex items-center justify-center gap-3 shadow-2xl shadow-green-200 active:scale-95 transition-transform">
                                    <Icon name="Send" size={20} /> SHARE / भेजें
                                </button>
                                <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-900 text-white font-black p-5 rounded-[2rem] shadow-xl transition-all active:scale-95">
                                    <Icon name="Printer" size={24} />
                                </button>
                                <button onClick={() => { if(confirm("Start fresh?")) { localStorage.clear(); location.reload(); } }} className="bg-red-50 hover:bg-red-100 text-red-600 p-5 rounded-[2rem] border-2 border-red-100 transition-all active:scale-95">
                                    <Icon name="RotateCcw" size={24} />
                                </button>
                            </React.Fragment>
                        )}
                    </footer>
                </div>
            );
        };

        const MealItem = ({ icon, color, label, name, nameHi, sub, yt, source, onEdit }) => {
            const colorMap = {
                orange: { bg: 'bg-orange-100', text: 'text-orange-600', hover: 'hover:bg-orange-50' },
                green: { bg: 'bg-green-100', text: 'text-green-600', hover: 'hover:bg-green-50' },
                purple: { bg: 'bg-purple-100', text: 'text-purple-600', hover: 'hover:bg-purple-50' },
                blue: { bg: 'bg-blue-100', text: 'text-blue-600', hover: 'hover:bg-blue-50' }
            };
            const theme = colorMap[color];

            return (
                <div className={`p-8 flex justify-between items-center group transition-all ${theme.hover}`}>
                    <div className="flex items-center gap-6">
                        <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${theme.bg} ${theme.text} shadow-sm group-hover:scale-110 transition-transform`}>
                            <Icon name={icon} size={28} />
                        </div>
                        <div>
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">{label}</p>
                            <h4 className="font-black text-slate-900 text-xl tracking-tighter leading-tight flex items-center gap-2">
                                {name}
                                {source && <span className={`text-[8px] px-1.5 py-0.5 rounded uppercase ${
                                    source === "Tarla Dalal" ? "bg-orange-100 text-orange-600" :
                                    source === "Hebbar's Kitchen" ? "bg-red-100 text-red-600" :
                                    source === "Bong Eats" ? "bg-yellow-100 text-yellow-700" :
                                    "bg-green-100 text-green-700"
                                }`}>{source === "Tarla Dalal" ? "TD" : source === "Hebbar's Kitchen" ? "HK" : source === "Bong Eats" ? "BE" : "HB"}</span>}
                            </h4>
                            <p className="text-sm font-bold text-slate-600 mt-1">{nameHi}</p>
                            <p className="text-[10px] font-bold text-blue-500 uppercase tracking-tight mt-1">{sub}</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-4">
                        <button onClick={onEdit} className="w-12 h-12 rounded-2xl flex items-center justify-center bg-slate-50 text-slate-400 hover:text-blue-600 hover:bg-white hover:shadow-lg transition-all opacity-0 group-hover:opacity-100">
                            <Icon name="Edit3" size={20} />
                        </button>
                        <a href={yt} target="_blank" rel="noreferrer" className="w-12 h-12 rounded-2xl flex items-center justify-center bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition-all shadow-sm">
                            <Icon name="Youtube" size={24} />
                        </a>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
